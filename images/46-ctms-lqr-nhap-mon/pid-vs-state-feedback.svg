<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 200" width="770" height="200" style="background:#ffffff; font-family:sans-serif; color:#334155;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L10,5 L0,9 z" fill="#64748B"/>
    </marker>
  </defs>

  <g transform="translate(10, 20)">
    <text x="0" y="0" font-size="16" font-weight="bold" fill="#334155">1. Sơ đồ PID (Chỉ phản hồi đầu ra y)</text>
    <rect x="150" y="20" width="100" height="40" rx="5" fill="#f8fafc" stroke="#64748B" stroke-width="2"/>
    <text x="200" y="45" font-size="14" text-anchor="middle" fill="#334155">PID</text>
    <rect x="350" y="20" width="100" height="40" rx="5" fill="#f8fafc" stroke="#64748B" stroke-width="2"/>
    <text x="400" y="45" font-size="14" text-anchor="middle" fill="#334155">Hệ thống</text>
    
    <path d="M 50 40 L 140 40" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="100" y="32" font-size="14" text-anchor="middle" fill="#334155">r (Lệnh)</text>
    
    <path d="M 250 40 L 340 40" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="300" y="32" font-size="14" text-anchor="middle" fill="#334155">u (Lực)</text>
    
    <path d="M 450 40 L 550 40" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="500" y="32" font-size="14" text-anchor="middle" fill="#334155">y (Đầu ra)</text>
    
    <path d="M 520 40 L 520 80 L 100 80 L 100 40" stroke="#64748B" stroke-width="2" fill="none"/>
  </g>

  <g transform="translate(10, 110)">
    <text x="0" y="0" font-size="16" font-weight="bold" fill="#334155">2. Sơ đồ LQR (Phản hồi toàn bộ trạng thái x)</text>
    <rect x="150" y="20" width="100" height="40" rx="5" fill="#f8fafc" stroke="#64748B" stroke-width="2"/>
    <text x="200" y="45" font-size="14" text-anchor="middle" fill="#334155">- K</text>
    <rect x="350" y="20" width="100" height="40" rx="5" fill="#f8fafc" stroke="#64748B" stroke-width="2"/>
    <text x="400" y="45" font-size="14" text-anchor="middle" fill="#334155">Hệ thống</text>
    
    <path d="M 50 40 L 140 40" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="100" y="32" font-size="14" text-anchor="middle" fill="#334155">r (Lệnh)</text>
    
    <path d="M 250 40 L 340 40" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="300" y="32" font-size="14" text-anchor="middle" fill="#334155">u</text>
    
    <path d="M 450 40 L 550 40" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="500" y="32" font-size="14" text-anchor="middle" fill="#334155">x (Trạng thái)</text>
    
    <path d="M 520 40 L 520 80 L 200 80 L 200 60" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  </g>
</svg>

