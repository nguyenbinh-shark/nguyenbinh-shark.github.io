<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="windup-title windup-desc">
  <title id="windup-title">Minh họa hiện tượng Integral Windup và cơ chế Clamping</title>
  <desc id="windup-desc">So sánh cuốn sổ ghi nợ khâu I khi thả rông gây vọt lố nặng nề và khi được kẹp giới hạn Anti-windup giúp hệ thống dừng êm.</desc>
  <defs>
    <marker id="arr-axis" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect width="800" height="380" rx="12" fill="#ffffff"/>
  <rect x="1" y="1" width="798" height="378" rx="11" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Panel 1: Thả rông khâu I (Windup nặng) -->
  <g transform="translate(40, 30)">
    <rect width="340" height="320" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/>
    <text x="16" y="28" font-size="14" font-weight="800" fill="#991b1b">1. Khi thả rông (Bị Windup)</text>
    <text x="16" y="48" font-size="11.5" fill="#7f1d1d">Sổ nợ phình to khi lò bão hòa 100%</text>

    <!-- Axes -->
    <line x1="45" y1="260" x2="315" y2="260" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-axis)"/>
    <line x1="45" y1="260" x2="45" y2="70" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-axis)"/>
    <text x="40" y="65" text-anchor="end" font-size="11" font-weight="700" fill="#64748b">°C</text>
    <text x="315" y="278" text-anchor="end" font-size="11" font-weight="700" fill="#64748b">Thời gian t</text>

    <!-- Setpoint line 60°C -->
    <line x1="45" y1="160" x2="300" y2="160" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="295" y="152" text-anchor="end" font-size="10.5" font-weight="700" fill="#2563eb">Đích 60°C</text>

    <!-- Temperature curve (Overshoot massively to 75°C) -->
    <path d="M 45 250 C 90 240, 110 160, 140 120 C 170 85, 200 90, 230 145 C 255 180, 275 160, 300 160" fill="none" stroke="#dc2626" stroke-width="2.5"/>

    <!-- I_term area (Phình to) -->
    <path d="M 45 255 Q 110 210 140 180 Q 180 150 220 220 L 220 260 L 45 260 Z" fill="#d97706" fill-opacity="0.25"/>
    <text x="110" y="235" font-size="11" font-weight="800" fill="#b45309">Sổ nợ I phình to!</text>

    <!-- Windup Callout Badge -->
    <rect x="135" y="65" width="165" height="32" rx="5" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <text x="142" y="80" font-size="10.5" font-weight="800" fill="#dc2626">⚠️ Vọt lố +31% (72.5°C)</text>
    <text x="142" y="93" font-size="9.5" fill="#475569">Mất nhiều thời gian xả nợ</text>
  </g>

  <!-- Panel 2: Đã có Anti-windup Clamping -->
  <g transform="translate(420, 30)">
    <rect width="340" height="320" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
    <text x="16" y="28" font-size="14" font-weight="800" fill="#166534">2. Có Anti-windup (Đã chữa)</text>
    <text x="16" y="48" font-size="11.5" fill="#14532d">Ngừng cộng nợ khi lò chạm trần 100%</text>

    <!-- Axes -->
    <line x1="45" y1="260" x2="315" y2="260" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-axis)"/>
    <line x1="45" y1="260" x2="45" y2="70" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-axis)"/>
    <text x="40" y="65" text-anchor="end" font-size="11" font-weight="700" fill="#64748b">°C</text>
    <text x="315" y="278" text-anchor="end" font-size="11" font-weight="700" fill="#64748b">Thời gian t</text>

    <!-- Setpoint line 60°C -->
    <line x1="45" y1="160" x2="300" y2="160" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="295" y="152" text-anchor="end" font-size="10.5" font-weight="700" fill="#2563eb">Đích 60°C</text>

    <!-- Temperature curve (Smooth rise, barely overshoots) -->
    <path d="M 45 250 C 95 240, 125 175, 155 155 C 180 148, 210 160, 300 160" fill="none" stroke="#16a34a" stroke-width="2.5"/>

    <!-- Clamped I_term area -->
    <path d="M 45 255 Q 90 235 140 230 L 220 230 L 220 260 L 45 260 Z" fill="#16a34a" fill-opacity="0.2"/>
    <line x1="45" y1="230" x2="220" y2="230" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3 2"/>
    <text x="85" y="222" font-size="10.5" font-weight="700" fill="#15803d">Trần nợ: I_MAX (Kẹp nợ)</text>

    <!-- Success Badge -->
    <rect x="135" y="65" width="165" height="32" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
    <text x="142" y="80" font-size="10.5" font-weight="800" fill="#16a34a">✅ Cập bến êm ái (62°C)</text>
    <text x="142" y="93" font-size="9.5" fill="#475569">Vọt lố giảm 4 lần, ổn định nhanh</text>
  </g>
</svg>
