<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="figure-title figure-desc">
  <title id="figure-title">Bốn chỉ tiêu trên một đáp ứng bậc thang</title>
  <desc id="figure-desc">Hình khái niệm cho bước đi lên từ giá trị đầu bằng 0. Đầu ra xanh dao động rồi lắng ở giá trị cuối thấp hơn điểm đặt cam. Thời gian lên đi từ 10 đến 90 phần trăm giá trị cuối. Vọt lố so đỉnh với giá trị cuối. Thời gian lắng là lần cuối đi vào dải cộng trừ 2 phần trăm biên độ thay đổi quanh giá trị cuối. Sai số xác lập là điểm đặt trừ giá trị cuối.</desc>
  <defs>
    <style>
      text { font-family: Inter, -apple-system, "Segoe UI", Arial, sans-serif; fill: #334155; }
      .title { font-size: 24px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-size: 16px; fill: #64748b; }
      .label { font-size: 16px; font-weight: 600; }
      .small { font-size: 14px; fill: #64748b; }
      .math { font-family: "Times New Roman", serif; font-style: italic; font-size: 19px; }
      .card-title { font-size: 17px; font-weight: 700; }
      .card-body { font-size: 15px; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2a6fbb"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#eb6834"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1baf7a"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b5ca6"/></marker>
  </defs>
  <rect width="960" height="760" fill="#ffffff"/>
  <text x="30" y="42" class="title">Nhanh, vượt đích, lắng và đúng đích: bốn câu hỏi khác nhau</text>
  <text x="30" y="70" class="subtitle">Hình khái niệm · bước đi lên từ y₀ = 0 · giá trị cuối được cố ý vẽ thấp hơn điểm đặt</text>
  <line x1="30" y1="87" x2="930" y2="87" stroke="#e2e8f0"/>

  <rect x="30" y="106" width="438" height="73" rx="10" fill="#eff6ff"/>
  <text x="45" y="131" class="card-title" style="fill:#2a6fbb">1. Thời gian lên Tᵣ</text>
  <text x="45" y="156" class="card-body">Từ 10% tới 90% biên độ thay đổi tới giá trị cuối.</text>
  <rect x="492" y="106" width="438" height="73" rx="10" fill="#fff4ef"/>
  <text x="507" y="131" class="card-title" style="fill:#eb6834">2. Vọt lố OS</text>
  <text x="507" y="156" class="card-body">Đỉnh vượt giá trị cuối, chia cho biên độ thay đổi.</text>

  <text x="60" y="217" class="label">Đầu ra y</text>
  <line x1="100" y1="215" x2="100" y2="570" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="100" y1="570" x2="850" y2="570" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="84" y="575" class="small" text-anchor="end">0</text>
  <text x="851" y="594" class="label" text-anchor="end">Thời gian t →</text>

  <rect x="100" y="294.6" width="750" height="10.8" fill="#e2e8f0"/>
  <line x1="100" y1="294.6" x2="850" y2="294.6" stroke="#94a3b8" stroke-dasharray="3 5"/>
  <line x1="100" y1="305.4" x2="850" y2="305.4" stroke="#94a3b8" stroke-dasharray="3 5"/>
  <line x1="100" y1="300" x2="850" y2="300" stroke="#64748b" stroke-dasharray="6 5"/>
  <line x1="100" y1="270" x2="850" y2="270" stroke="#eb6834" stroke-width="2" stroke-dasharray="9 5"/>
  <text x="704" y="259" class="label" style="fill:#eb6834">Điểm đặt r</text>
  <text x="704" y="330" class="label">Giá trị cuối y∞</text>
  <text x="665" y="359" class="small">Dải y∞ ± 2% |y∞ − y₀|</text>
  <path d="M 746 344 L 746 306" fill="none" stroke="#64748b"/>

  <line x1="100" y1="543" x2="136" y2="543" stroke="#cbd5e1" stroke-dasharray="4 4"/>
  <line x1="100" y1="327" x2="250" y2="327" stroke="#cbd5e1" stroke-dasharray="4 4"/>
  <text x="86" y="547" class="small" text-anchor="end">10%</text>
  <text x="86" y="331" class="small" text-anchor="end">90%</text>
  <path d="M 100 570 C 112 565 122 552 136 543 C 170 520 210 385 250 327 C 285 278 320 232 350 228 C 390 224 430 321 455 338 C 495 355 530 302 555 286 C 580 276 600 297 620 309 C 625 310 632 307 640 305.4 C 665 295 700 301 750 300 L 850 300" fill="none" stroke="#2a6fbb" stroke-width="3.5" stroke-linecap="round"/>
  <text x="393" y="399" class="label" style="fill:#2a6fbb">Đầu ra y(t)</text>
  <path d="M 476 389 L 468 344" fill="none" stroke="#2a6fbb"/>

  <circle cx="136" cy="543" r="4" fill="#2a6fbb"/>
  <circle cx="250" cy="327" r="4" fill="#2a6fbb"/>
  <line x1="136" y1="543" x2="136" y2="586" stroke="#2a6fbb" stroke-dasharray="4 4"/>
  <line x1="250" y1="327" x2="250" y2="586" stroke="#2a6fbb" stroke-dasharray="4 4"/>
  <line x1="139" y1="585" x2="247" y2="585" stroke="#2a6fbb" stroke-width="1.8" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <text x="136" y="612" class="small" text-anchor="middle">t₁₀</text>
  <text x="250" y="612" class="small" text-anchor="middle">t₉₀</text>
  <text x="193" y="608" class="math" text-anchor="middle" style="fill:#2a6fbb">Tᵣ</text>

  <circle cx="350" cy="228" r="4" fill="#eb6834"/>
  <line x1="350" y1="228" x2="394" y2="228" stroke="#eb6834" stroke-dasharray="4 4"/>
  <line x1="390" y1="232" x2="390" y2="296" stroke="#eb6834" stroke-width="1.8" marker-start="url(#arrow-orange)" marker-end="url(#arrow-orange)"/>
  <text x="402" y="250" class="label" style="fill:#eb6834">Vượt giá trị cuối</text>

  <line x1="640" y1="305.4" x2="640" y2="570" stroke="#1baf7a" stroke-width="1.5" stroke-dasharray="5 5"/>
  <circle cx="640" cy="305.4" r="4" fill="#1baf7a"/>
  <line x1="104" y1="463" x2="636" y2="463" stroke="#1baf7a" stroke-width="1.8" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>
  <text x="370" y="451" class="label" text-anchor="middle" style="fill:#14805a">Tₛ: từ bước đặt tới lúc lắng</text>
  <text x="640" y="593" class="math" text-anchor="middle" style="fill:#14805a">Tₛ</text>

  <line x1="852" y1="270" x2="874" y2="270" stroke="#8b5ca6"/>
  <line x1="852" y1="300" x2="874" y2="300" stroke="#8b5ca6"/>
  <line x1="870" y1="274" x2="870" y2="296" stroke="#8b5ca6" stroke-width="1.8" marker-start="url(#arrow-purple)" marker-end="url(#arrow-purple)"/>
  <text x="884" y="289" class="math" style="fill:#8b5ca6">eₛₛ</text>

  <rect x="30" y="634" width="438" height="73" rx="10" fill="#eefaf5"/>
  <text x="45" y="659" class="card-title" style="fill:#14805a">3. Thời gian lắng Tₛ</text>
  <text x="45" y="684" class="card-body">Vào dải quanh giá trị cuối và không đi ra nữa.</text>
  <rect x="492" y="634" width="438" height="73" rx="10" fill="#f6f1fa"/>
  <text x="507" y="659" class="card-title" style="fill:#8b5ca6">4. Sai số xác lập eₛₛ</text>
  <text x="507" y="684" class="card-body">Điểm đặt r trừ giá trị cuối thật sự y∞.</text>
  <text x="30" y="738" class="small">Đã lắng không có nghĩa đã đúng đích. Khi đo theo điểm đặt, phải ghi rõ mốc chuẩn khác với y∞.</text>
</svg>
