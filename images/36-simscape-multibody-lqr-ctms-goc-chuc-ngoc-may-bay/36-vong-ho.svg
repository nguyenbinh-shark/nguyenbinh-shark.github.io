<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="t1 d1">
  <title id="t1">Vòng hở: giữ cánh lái lệch 1 độ</title>
  <desc id="d1">Đồ thị theo thời gian từ 0 đến 30 giây. Góc pitch theta tăng đều khoảng 0.19 độ mỗi giây và không dừng. Góc tấn alpha dao động rồi dừng ở 1.36 độ. Góc quỹ đạo gamma đi sau theta một khoảng bằng alpha.</desc>
  <defs>
    <style>
      text { font-family: Inter, -apple-system, "Segoe UI", Arial, sans-serif; }
      .h1 { font-size: 24px; font-weight: 800; fill: #0f172a; }
      .h2 { font-size: 16px; font-weight: 500; fill: #64748b; }
      .pt { font-size: 16px; font-weight: 700; fill: #1e293b; }
      .ax { font-size: 14px; font-weight: 500; fill: #64748b; font-variant-numeric: tabular-nums; }
      .axl { font-size: 14px; font-weight: 500; fill: #64748b; }
      .lg { font-size: 15px; font-weight: 500; fill: #334155; }
      .an { font-size: 14px; font-weight: 600; fill: #334155; }
      .anm { font-size: 14px; font-weight: 500; fill: #475569; }
      .m { font-family: "Times New Roman", "STIX Two Text", Times, serif; font-style: italic; }
    </style>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
<text x="30" y="42" class="h1">Giữ cánh lái lệch 1°: máy bay nâng mũi mãi không dừng</text>
<text x="30" y="68" class="h2">Mô hình CTMS, vòng hở · δ = 1° từ t = 0, không có bộ điều khiển</text>
