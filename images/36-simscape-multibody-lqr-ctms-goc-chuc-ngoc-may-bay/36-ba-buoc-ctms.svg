<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="t1 d1">
  <title id="t1">Ba bước thiết kế LQR của CTMS</title>
  <desc id="d1">Trên: góc pitch theo thời gian khi đặt 0.2 rad. p bằng 2 không có Nbar dừng ở 0.141. p bằng 50 không có Nbar chỉ tới 0.028. p bằng 50 có Nbar bằng 7.07 lên 0.2 trong 0.73 giây, vọt lố 4.9 phần trăm. Dưới: cánh lái của bộ cuối giật lên 81 độ tại t bằng 0, gấp hơn ba lần giới hạn 25 độ thường gặp.</desc>
