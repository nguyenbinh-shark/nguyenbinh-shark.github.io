<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="t1 d1">
  <title id="t1">Sơ đồ khối LQR có reference precompensation</title>
  <desc id="d1">Lệnh theta đặt r nhân với Nbar, trừ đi K nhân trạng thái x, ra góc cánh lái delta vào máy bay. Máy bay trả ra ba trạng thái alpha, q, theta, được đo và nhân với hàng K ba số.</desc>
  <defs>
    <style>
      text { font-family: Inter, -apple-system, "Segoe UI", Arial, sans-serif; }
      .h1 { font-size: 24px; font-weight: 800; fill: #0f172a; }
      .h2 { font-size: 16px; font-weight: 500; fill: #64748b; }
      .pt { font-size: 16px; font-weight: 700; fill: #1e293b; }
      .ax { font-size: 14px; font-weight: 500; fill: #64748b; font-variant-numeric: tabular-nums; }
      .axl { font-size: 14px; font-weight: 500; fill: #64748b; }
      .lg { font-size: 15px; font-weight: 500; fill: #334155; }
      .an { font-size: 14px; font-weight: 600; fill: #334155; }
      .anm { font-size: 14px; font-weight: 500; fill: #475569; }
      .m { font-family: "Times New Roman", "STIX Two Text", Times, serif; font-style: italic; }
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
  </defs>
  <rect width="960" height="330" fill="#ffffff"/>

<text x="30" y="42" class="h1">LQR cho góc pitch: một hàng K và một hệ số <tspan class="m">N̄</tspan></text>
<text x="30" y="68" class="h2">Ba trạng thái đều đo được trên máy bay thật: cảm biến góc tấn, con quay đo tốc độ góc, hệ dẫn đường quán tính</text>
<line x1="30" y1="86" x2="930" y2="86" stroke="#e2e8f0"/>
<text x="40" y="148" class="an"><tspan class="m">r</tspan> = <tspan class="m">θ</tspan><tspan font-size="12" dy="4">đặt</tspan></text>
<line x1="40" y1="160" x2="128" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="130" y="130" width="90" height="60" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="175.0" y="166.0" class="anm" text-anchor="middle"><tspan class="m" font-size="22">N̄</tspan></text>
<line x1="220" y1="160" x2="288" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<circle cx="305" cy="160" r="16" fill="#ffffff" stroke="#475569" stroke-width="2"/>
<text x="305" y="166" class="pt" text-anchor="middle">Σ</text>
<text x="284" y="142" class="an">+</text>
<text x="312" y="200" class="an">−</text>
<line x1="321" y1="160" x2="438" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<text x="380" y="148" class="an" text-anchor="middle"><tspan class="m">δ</tspan></text>
<rect x="440" y="120" width="230" height="80" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<text x="555.0" y="155.0" class="pt" text-anchor="middle">Máy bay</text>
<text x="555.0" y="177.0" class="anm" text-anchor="middle"><tspan class="m">ẋ</tspan> = <tspan class="m">A</tspan><tspan class="m">x</tspan> + <tspan class="m">B</tspan><tspan class="m">δ</tspan></text>
<line x1="670" y1="160" x2="900" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<text x="785" y="148" class="an" text-anchor="middle"><tspan class="m">x</tspan> = (<tspan class="m">α</tspan>, <tspan class="m">q</tspan>, <tspan class="m">θ</tspan>)</text>
<circle cx="760" cy="160" r="4" fill="#475569"/>
<polyline points="760,160 760,260 600,260" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="440" y="230" width="160" height="60" rx="10" fill="#fff7ed" stroke="#eb6834" stroke-width="2"/>
<text x="520.0" y="266.0" class="anm" text-anchor="middle"><tspan class="m">K</tspan> = [<tspan class="m">K</tspan><tspan font-size="12" dy="4">α</tspan><tspan dy="-4"> </tspan><tspan class="m">K</tspan><tspan font-size="12" dy="4">q</tspan><tspan dy="-4"> </tspan><tspan class="m">K</tspan><tspan font-size="12" dy="4">θ</tspan><tspan dy="-4">]</tspan></text>
<polyline points="440,260 305,260 305,178" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<text x="40" y="308" class="anm">Luật điều khiển: <tspan class="m">δ</tspan> = <tspan class="m">N̄</tspan>·<tspan class="m">r</tspan> − <tspan class="m">K</tspan><tspan class="m">x</tspan>. Mục 6.1 chỉ ra vì sao ở bài này <tspan class="m">N̄</tspan> đúng bằng <tspan class="m">K</tspan><tspan font-size="12" dy="4">θ</tspan><tspan dy="-4"> = √</tspan><tspan class="m">p</tspan>.</text>
</svg>
