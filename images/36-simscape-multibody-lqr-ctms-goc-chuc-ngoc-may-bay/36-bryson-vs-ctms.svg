<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="t1 d1">
  <title id="t1">Bryson so với CTMS</title>
  <desc id="d1">Trên: góc pitch. Bộ CTMS p bằng 50 lên nhanh nhất; khi kẹp cánh lái ở 25 độ thì chậm hơn chút, vẫn đạt yêu cầu. Bộ Bryson p bằng 4.76 lên trong 1.27 giây, vọt lố 3.2 phần trăm, lắng sau 8.7 giây. Dưới: cánh lái. CTMS giật 81 độ, bản kẹp nằm sát 25 độ trong 0.5 giây, Bryson chạm đúng 25 độ tại t bằng 0 rồi giảm.</desc>
