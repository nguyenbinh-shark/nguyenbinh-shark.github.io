<text x="30.0" y="612.0" class="anm" text-anchor="start">Cực chậm của p = 2 cách zero 0.020; của p = 50 chỉ còn 0.001. Xem vì sao điều đó quyết định thời gian lắng ở mục 6.2.</text>
