<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="t1 d1">
  <title id="t1">Quỹ đạo cực khi tăng p</title>
  <desc id="d1">Mặt phẳng s, nửa trên. Khi p tăng từ 0.001 đến 100000, cặp cực phức đi từ cực vòng hở -0.37 cộng 0.89j ra xa theo đường zeta 0.707. Cực thực chậm đi từ gốc tọa độ vào zero tại -0.154 nhưng không bao giờ vượt qua nó.</desc>
