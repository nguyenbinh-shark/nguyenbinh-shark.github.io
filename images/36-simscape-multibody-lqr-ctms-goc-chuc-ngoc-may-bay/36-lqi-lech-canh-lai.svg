  <title id="t1">Cánh lái lệch 1 độ</title>
  <desc id="d1">Trên: góc pitch từ 0 đến 60 giây, lệnh 11.46 độ tại t bằng 0, cánh lái bị lệch thêm 1 độ từ giây 30. LQI tích phân liên tục vọt lố 31.8 phần trăm khi đổi lệnh. Dưới: sai số sau giây 25. LQR giữ sai 0.46 độ mãi mãi, hai bản LQI đưa về 0.</desc>
