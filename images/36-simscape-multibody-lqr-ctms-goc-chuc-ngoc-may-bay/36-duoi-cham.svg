  <title id="t1">Đuôi chậm và góc tấn</title>
  <desc id="d1">Trên: phóng to quanh 0.2 rad. p bằng 2 bò dần vào dải 2 phần trăm sau 15 giây, p bằng 4.76 sau 8.7 giây, p bằng 50 sau 2 giây. Dưới: với p bằng 4.76, góc tấn vọt lên 10.7 độ rồi tắt dần với hằng số thời gian khoảng 6.5 giây, góc quỹ đạo chúi xuống 1.8 độ trước khi lên theo.</desc>
