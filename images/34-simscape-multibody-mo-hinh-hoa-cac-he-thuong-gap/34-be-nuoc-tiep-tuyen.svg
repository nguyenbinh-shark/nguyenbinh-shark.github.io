<text x="340" y="104" class="lg">Tiếp tuyến tại h* = 0.05 m</text>
<line x1="575" y1="99" x2="605" y2="99" stroke="#eb6834" stroke-width="3" stroke-dasharray="7 5"/>
<text x="615" y="104" class="lg">Tiếp tuyến tại h* = 0.20 m</text>
