<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="t1 d1">
<title id="t1">Lưu lượng chảy ra của bể nước và hai tiếp tuyến</title>
<desc id="d1">Đường cong lưu lượng chảy ra tỉ lệ với căn bậc hai mực nước, từ 0 đến 0.35 m. Hai tiếp tuyến tại mực nước 0.05 m và 0.2 m có độ dốc khác nhau: tiếp tuyến ở mực thấp dốc gấp đôi tiếp tuyến ở mực cao, nên mô hình tuyến tính hóa ở mỗi mực nước có hằng số thời gian khác nhau, 20 giây và 40 giây.</desc>
<style>
text { font-family: Inter, -apple-system, "Segoe UI", Arial, sans-serif; }
.h1 { font-size: 23px; font-weight: 800; fill: #0f172a; }
.h2 { font-size: 15px; font-weight: 500; fill: #64748b; }
.ax { font-size: 14px; font-weight: 500; fill: #64748b; }
.lg { font-size: 15px; font-weight: 600; fill: #1e293b; }
.an { font-size: 14px; font-weight: 600; fill: #334155; }
</style>
<rect width="960" height="590" fill="#ffffff"/>
<text x="40" y="42" class="h1">Một đường cong, hai tiếp tuyến: tuyến tính hóa phụ thuộc điểm làm việc</text>
<text x="40" y="68" class="h2">Lưu lượng chảy ra của bể (lỗ 8 mm, đáy 0.01 m²) theo mực nước. Độ dốc tiếp tuyến chính là hệ số trong A.</text>
<line x1="40" y1="99" x2="70" y2="99" stroke="#1e293b" stroke-width="3"/>
