<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="t1 d1">
  <title id="t1">Sơ đồ nối dây Simulink cho bộ điều khiển LQR</title>
  <desc id="d1">Đường thuận: vector trạng thái trừ vector đặt, nhân với khối Gain âm K, qua khối bão hòa lực, công tắc tay, cộng nhiễu rồi vào cơ hệ Simscape. Đường hồi tiếp: bốn tín hiệu cảm biến x, vận tốc xe, góc và vận tốc góc đi qua khối đổi dấu góc nếu cần, giữ mẫu 1 mili giây, rồi gộp bằng khối Mux theo đúng thứ tự trạng thái.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, "Segoe UI", Arial, sans-serif; }
      .h1 { font-size: 24px; font-weight: 800; fill: #0f172a; }
      .h2 { font-size: 16px; font-weight: 500; fill: #64748b; }
      .bt { font-size: 16px; font-weight: 700; fill: #1e293b; }
      .bs { font-size: 14px; font-weight: 500; fill: #64748b; }
      .btA { font-size: 16px; font-weight: 700; fill: #92400e; }
      .bsA { font-size: 14px; font-weight: 600; fill: #a16207; }
      .sig { font-size: 15px; font-weight: 600; fill: #475569; }
      .fb  { font-size: 14px; font-weight: 600; fill: #94a3b8; }
      .sgn { font-size: 15px; font-weight: 700; fill: #475569; }
      .note { font-size: 15px; font-weight: 500; fill: #475569; }
      .sub { font-size: 11px; }
    </style>
  </defs>

  <rect width="1000" height="520" fill="#ffffff"/>
  <text x="40" y="46" class="h1">Nối LQR vào mô hình Bài 3: hai khối PID thành một khối Gain</text>
  <text x="40" y="74" class="h2">Giữ nguyên cơ hệ Simscape, công tắc tay và khối nhiễu; chỉ thay phần giữa.</text>
  <line x1="40" y1="94" x2="960" y2="94" stroke="#e2e8f0"/>

  <!-- reference -->
  <rect x="40" y="150" width="120" height="58" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="100" y="174" text-anchor="middle" class="bt">Constant</text>
  <text x="100" y="196" text-anchor="middle" class="bs">[x_ref; 0; 0; 0]</text>
  <path d="M 160 179 H 204" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>

  <circle cx="222" cy="179" r="17" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="196" y="166" class="sgn">−</text>
  <text x="230" y="222" class="sgn">+</text>
  <path d="M 239 179 H 282" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <text x="260" y="168" text-anchor="middle" class="fb">e</text>

  <rect x="286" y="146" width="130" height="66" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
  <text x="351" y="174" text-anchor="middle" class="btA">Gain  −K</text>
  <text x="351" y="196" text-anchor="middle" class="bsA">Matrix (K*u)</text>
  <path d="M 416 179 H 456" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="460" y="150" width="120" height="58" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="520" y="174" text-anchor="middle" class="bt">Saturation</text>
  <text x="520" y="196" text-anchor="middle" class="bs">±20 N</text>
  <path d="M 580 179 H 616" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="620" y="150" width="104" height="58" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="672" y="174" text-anchor="middle" class="bt">Manual</text>
  <text x="672" y="196" text-anchor="middle" class="bs">Switch</text>
  <path d="M 724 179 H 756" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>

  <circle cx="774" cy="179" r="17" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="756" y="160" class="sgn">+</text>
  <text x="782" y="160" class="sgn">+</text>
  <path d="M 774 112 V 158" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arf)"/>
  <text x="790" y="124" class="fb">Disturbance</text>
  <path d="M 791 179 H 828" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <text x="810" y="168" text-anchor="middle" class="fb">F</text>

  <rect x="832" y="134" width="128" height="150" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="896" y="166" text-anchor="middle" class="bt">Cơ hệ</text>
  <text x="896" y="188" text-anchor="middle" class="bt">Simscape</text>
  <text x="896" y="214" text-anchor="middle" class="bs">ra: θ, ω,</text>
  <text x="896" y="234" text-anchor="middle" class="bs">x, v</text>

  <!-- feedback path -->
  <path d="M 896 284 V 330" stroke="#94a3b8" stroke-width="2" marker-end="url(#arf)"/>
  <rect x="770" y="334" width="190" height="66" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="865" y="361" text-anchor="middle" class="bt">Gain −1 cho θ, ω</text>
  <text x="865" y="383" text-anchor="middle" class="bs">file Bài 1, 3: bắt buộc</text>
  <path d="M 770 367 H 666" stroke="#94a3b8" stroke-width="2" marker-end="url(#arf)"/>

  <rect x="520" y="334" width="142" height="66" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="591" y="361" text-anchor="middle" class="bt">Zero-Order Hold</text>
  <text x="591" y="383" text-anchor="middle" class="bs">T<tspan class="sub" dy="3">s</tspan><tspan dy="-3"> = 1 ms</tspan></text>
  <path d="M 520 367 H 372" stroke="#94a3b8" stroke-width="2" marker-end="url(#arf)"/>

  <rect x="276" y="318" width="92" height="98" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="322" y="346" text-anchor="middle" class="bt">Mux</text>
  <text x="322" y="372" text-anchor="middle" class="bs">x, v,</text>
  <text x="322" y="394" text-anchor="middle" class="bs">θ, ω</text>
  <path d="M 276 367 H 222 V 200" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arf)"/>
  <text x="140" y="300" class="fb">vector trạng thái s</text>

  <!-- Footnote -->
  <line x1="40" y1="446" x2="960" y2="446" stroke="#e2e8f0"/>
  <text x="40" y="474" class="note">Thứ tự bốn cổng của Mux phải trùng thứ tự trạng thái lúc tính K: [x, v, θ, ω]. Sai thứ tự là sai cả bốn hệ số.</text>
  <text x="40" y="500" class="note">Khối nét đứt: bắt buộc với file Simscape của Bài 1 và Bài 3, vì chiều dương khớp quay ngược quy ước (mục 6.2).</text>
</svg>
