<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="t1 d1">
<title id="t1">Vị trí cực vòng kín của Cascade-PID và LQR trên mặt phẳng s</title>
<desc id="d1">Hai khung: bên trái là toàn cảnh nửa trên mặt phẳng s với các cực nhanh, bên phải phóng to vùng gần gốc với các cực chậm. Cặp cực chậm của Cascade-PID bản web nằm ở −0.29 ± 1.20j với damping ratio 0.23; bộ hệ số trong file Simulink của Bài 3 có cặp cực chậm ở +0.08 ± 1.08j, tức nằm bên phải trục ảo. Cặp cực chậm của LQR nằm ở −1.64 ± 1.43j với damping ratio 0.76.</desc>
