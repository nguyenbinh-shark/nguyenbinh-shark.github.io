<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc"><title id="title">Động cơ DC: điện áp, dòng, mômen và góc</title><desc id="desc">Điện áp tạo dòng điện qua điện trở và điện cảm. Dòng nhân K tạo mômen, tác động lên rotor quán tính J với ma sát b. Tốc độ tạo sức điện động K omega chống điện áp nguồn. Đầu ra điều khiển là góc rotor.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="#334155"/></marker></defs><rect width="1120" height="480" rx="20" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#0f172a"><text x="35" y="50" font-size="29" font-weight="bold">Điện áp → dòng điện → mômen → rotor quay</text><rect x="40" y="115" width="185" height="95" rx="13" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="132" y="152" text-anchor="middle" font-size="24">Nguồn V</text><text x="132" y="185" text-anchor="middle" font-size="19">đầu vào điều khiển</text><rect x="320" y="115" width="220" height="95" rx="13" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="430" y="152" text-anchor="middle" font-size="23">Phần ứng R, L</text><text x="430" y="185" text-anchor="middle" font-size="20">dòng điện i (A)</text><rect x="640" y="115" width="170" height="95" rx="13" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="725" y="152" text-anchor="middle" font-size="24">Mômen K·i</text><text x="725" y="185" text-anchor="middle" font-size="20">N·m</text><circle cx="960" cy="163" r="75" fill="#fed7aa" stroke="#ea580c" stroke-width="3"/><path d="M910 153h100v20H910z" fill="#ea580c"/><circle cx="960" cy="163" r="9" fill="#334155"/><path d="M225 163h90M540 163h95M810 163h65" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><text x="960" y="270" text-anchor="middle" font-size="24">Rotor: J, b</text><text x="960" y="305" text-anchor="middle" font-size="22">Góc θ (rad)</text><path d="M960 238v110H430v-125" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><text x="675" y="385" text-anchor="middle" font-size="23">Sức điện động K·ω chống lại điện áp nguồn</text><text x="35" y="442" font-size="17" fill="#475569">Thông số/phương trình: CTMS. Hình chuyển thể CC BY-SA 4.0. Trục cứng, ma sát nhớt, chưa có giới hạn dòng/nhiệt.</text></g></svg>