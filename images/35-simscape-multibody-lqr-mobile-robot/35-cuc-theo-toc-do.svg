<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="t1 d1">
  <title id="t1">Cực kênh ngang của Kanayama và LQR khi đổi tốc độ</title>
  <desc id="d1">Mặt phẳng s, nửa trên. Cực kênh ngang của Kanayama ở 0.3, 0.6 và 0.9 m/s nằm trên tia damping ratio 0.45 và cách gốc tỉ lệ thuận với tốc độ. Cực của LQR nằm trên tia 0.707 và cách gốc tỉ lệ với căn bậc hai của tốc độ. Cực kênh dọc của cả hai nằm tại âm 1.5 trên trục thực.</desc>
  <defs>
    <style>
      text { font-family: Inter, -apple-system, "Segoe UI", Arial, sans-serif; }
      .h1 { font-size: 24px; font-weight: 800; fill: #0f172a; }
      .h2 { font-size: 16px; font-weight: 500; fill: #64748b; }
      .pt { font-size: 16px; font-weight: 700; fill: #1e293b; }
      .ax { font-size: 14px; font-weight: 500; fill: #64748b; font-variant-numeric: tabular-nums; }
      .axl { font-size: 14px; font-weight: 500; fill: #64748b; }
      .lg { font-size: 15px; font-weight: 500; fill: #334155; }
      .an { font-size: 14px; font-weight: 600; fill: #334155; }
      .anm { font-size: 14px; font-weight: 500; fill: #475569; }
      .m { font-family: "Times New Roman", "STIX Two Text", Times, serif; font-style: italic; }
    </style>
  </defs>
  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="30" y="42" class="h1">Đổi tốc độ: cực của hai bộ điều khiển trượt trên hai tia khác nhau</text>
  <text x="30" y="68" class="h2">Kênh ngang khi chạy thẳng, nửa trên mặt phẳng s. Tia nét đứt: các điểm có cùng damping ratio ζ.</text>

<line x1="30" y1="86" x2="970" y2="86" stroke="#e2e8f0"/>
<rect x="40.0" y="103.0" width="12" height="12" fill="#2a78d6"/>
<text x="60.0" y="114.0" class="lg">Kanayama (Bài 5)</text>
<circle cx="237.2" cy="109.0" r="6.5" fill="#eb6834"/>
<text x="251.2" y="114.0" class="lg">LQR bộ chính</text>
<rect x="432.0" y="176.0" width="38.0" height="361.0" fill="#f1f5f9" opacity="0.6"/>
<line x1="90.0" y1="537.0" x2="470.0" y2="537.0" stroke="#cbd5e1"/>
<text x="82.0" y="542.0" class="ax" text-anchor="end">0</text>
<line x1="90.0" y1="442.0" x2="470.0" y2="442.0" stroke="#e2e8f0"/>
<text x="82.0" y="447.0" class="ax" text-anchor="end">0.5</text>
<line x1="90.0" y1="347.0" x2="470.0" y2="347.0" stroke="#e2e8f0"/>
<text x="82.0" y="352.0" class="ax" text-anchor="end">1</text>
<line x1="90.0" y1="252.0" x2="470.0" y2="252.0" stroke="#e2e8f0"/>
<text x="82.0" y="257.0" class="ax" text-anchor="end">1.5</text>
<line x1="147.0" y1="537.0" x2="147.0" y2="542.0" stroke="#cbd5e1"/>
<text x="147.0" y="558.0" class="ax" text-anchor="middle">−1.5</text>
<line x1="242.0" y1="537.0" x2="242.0" y2="542.0" stroke="#cbd5e1"/>
<text x="242.0" y="558.0" class="ax" text-anchor="middle">−1</text>
<line x1="337.0" y1="537.0" x2="337.0" y2="542.0" stroke="#cbd5e1"/>
<text x="337.0" y="558.0" class="ax" text-anchor="middle">−0.5</text>
<line x1="432.0" y1="537.0" x2="432.0" y2="542.0" stroke="#cbd5e1"/>
<text x="432.0" y="558.0" class="ax" text-anchor="middle">0</text>
<line x1="90.0" y1="537.0" x2="470.0" y2="537.0" stroke="#cbd5e1"/>
<text x="470.0" y="579.0" class="axl" text-anchor="end">phần thực (1/s)</text>
<text x="90.0" y="162.0" class="pt">phần ảo (rad/s)</text>
<line x1="432.0" y1="176.0" x2="432.0" y2="537.0" stroke="#cbd5e1"/>
<text x="451.0" y="196.0" class="anm" text-anchor="middle">mất</text>
<text x="451.0" y="214.0" class="anm" text-anchor="middle">ổn định</text>
<line x1="432.0" y1="537.0" x2="251.5" y2="176.0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="267.5" y="168.0" class="anm" text-anchor="middle">ζ = 0.45</text>
<line x1="432.0" y1="537.0" x2="90.0" y2="195.0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="86.0" y="187.0" class="anm" text-anchor="middle">ζ = 0.707</text>
<path d="M 140.0 530.0 L 154.0 544.0 M 140.0 544.0 L 154.0 530.0" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
<text x="177.0" y="523.0" class="anm" text-anchor="middle">kênh dọc: −1.5 (cả hai)</text>
<polyline points="375.0,423.0 318.0,309.0 261.0,195.0" fill="none" stroke="#2a78d6" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="2 4"/>
<polyline points="267.5,372.5 199.3,304.3 147.0,252.0" fill="none" stroke="#eb6834" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="2 4"/>
<rect x="368.5" y="416.5" width="13" height="13" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
<text x="387.0" y="428.0" class="an">0.3 m/s</text>
<rect x="311.5" y="302.5" width="13" height="13" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
<text x="330.0" y="314.0" class="an">0.6 m/s</text>
<rect x="254.5" y="188.5" width="13" height="13" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
<text x="273.0" y="200.0" class="an">0.9 m/s</text>
<circle cx="267.5" cy="372.5" r="7.5" fill="#eb6834" stroke="#ffffff" stroke-width="2"/>
<text x="255.5" y="377.5" class="an" text-anchor="end">0.3</text>
<circle cx="199.3" cy="304.3" r="7.5" fill="#eb6834" stroke="#ffffff" stroke-width="2"/>
<text x="187.3" y="309.3" class="an" text-anchor="end">0.6</text>
<circle cx="147.0" cy="252.0" r="7.5" fill="#eb6834" stroke="#ffffff" stroke-width="2"/>
<text x="135.0" y="257.0" class="an" text-anchor="end">0.9</text>
<text x="540" y="190" class="pt">Kanayama</text>
<text x="540" y="214" class="anm">δω = v<tspan font-size="11" dy="3">r</tspan><tspan dy="-3">·K</tspan><tspan font-size="11" dy="3">y</tspan><tspan dy="-3">·e</tspan><tspan font-size="11" dy="3">y</tspan><tspan dy="-3"> + v</tspan><tspan font-size="11" dy="3">r</tspan><tspan dy="-3">·K</tspan><tspan font-size="11" dy="3">z</tspan><tspan dy="-3">·e</tspan><tspan font-size="11" dy="3">ψ</tspan></text>
<text x="540" y="238" class="anm">ω<tspan font-size="11" dy="3">n</tspan><tspan dy="-3"> = v</tspan><tspan font-size="11" dy="3">r</tspan><tspan dy="-3">·√K</tspan><tspan font-size="11" dy="3">y</tspan><tspan dy="-3">: tỉ lệ thuận với tốc độ</tspan></text>
<text x="540" y="262" class="anm">ζ = K<tspan font-size="11" dy="3">z</tspan><tspan dy="-3"> / (2√K</tspan><tspan font-size="11" dy="3">y</tspan><tspan dy="-3">) = 0.45 ở mọi tốc độ</tspan></text>
<text x="540" y="308" class="pt">LQR bộ chính</text>
<text x="540" y="332" class="anm">δω = k<tspan font-size="11" dy="3">y</tspan><tspan dy="-3">·e</tspan><tspan font-size="11" dy="3">y</tspan><tspan dy="-3"> + k</tspan><tspan font-size="11" dy="3">ψ</tspan><tspan dy="-3">·e</tspan><tspan font-size="11" dy="3">ψ</tspan><tspan dy="-3">,  k</tspan><tspan font-size="11" dy="3">ψ</tspan><tspan dy="-3"> = √(2v</tspan><tspan font-size="11" dy="3">r</tspan><tspan dy="-3">k</tspan><tspan font-size="11" dy="3">y</tspan><tspan dy="-3">)</tspan></text>
<text x="540" y="356" class="anm">ω<tspan font-size="11" dy="3">n</tspan><tspan dy="-3"> = √(v</tspan><tspan font-size="11" dy="3">r</tspan><tspan dy="-3">·k</tspan><tspan font-size="11" dy="3">y</tspan><tspan dy="-3">): tỉ lệ với căn tốc độ</tspan></text>
<text x="540" y="380" class="anm">ζ = 0.707 ở mọi tốc độ khi không phạt e<tspan font-size="11" dy="3">ψ</tspan></text>
<text x="540" y="430" class="pt">ω<tspan font-size="12" dy="3">n</tspan><tspan dy="-3"> kênh ngang (rad/s)</tspan></text>
<text x="730" y="460" class="ax" text-anchor="end">0.3 m/s</text>
<text x="820" y="460" class="ax" text-anchor="end">0.6 m/s</text>
<text x="910" y="460" class="ax" text-anchor="end">0.9 m/s</text>
<line x1="540" y1="470" x2="920" y2="470" stroke="#e2e8f0"/>
<rect x="540" y="484" width="11" height="11" fill="#2a78d6"/>
<text x="560" y="494" class="lg">Kanayama</text>
<text x="730" y="494" class="lg" text-anchor="end" style="font-variant-numeric: tabular-nums">0.67</text>
<text x="820" y="494" class="lg" text-anchor="end" style="font-variant-numeric: tabular-nums">1.34</text>
<text x="910" y="494" class="lg" text-anchor="end" style="font-variant-numeric: tabular-nums">2.01</text>
<circle cx="545" cy="515" r="6" fill="#eb6834"/>
<text x="560" y="520" class="lg">LQR</text>
<text x="730" y="520" class="lg" text-anchor="end" style="font-variant-numeric: tabular-nums">1.22</text>
<text x="820" y="520" class="lg" text-anchor="end" style="font-variant-numeric: tabular-nums">1.73</text>
<text x="910" y="520" class="lg" text-anchor="end" style="font-variant-numeric: tabular-nums">2.12</text>
<text x="540" y="570" class="anm">Ở 0.3 m/s, LQR sửa lệch ngang mạnh hơn rõ rệt;</text>
<text x="540" y="590" class="anm">ở 0.9 m/s hai bộ gần như ngang nhau.</text>
</svg>
