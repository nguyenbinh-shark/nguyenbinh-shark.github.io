<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="t1 d1">
  <title id="t1">Ba sai số trong hệ thân xe và đường đi của hai lệnh</title>
  <desc id="d1">Bên trái: robot, trục thân x_b hướng mũi xe và y_b sang trái, tư thế đặt nằm phía trước bên trái trên quỹ đạo. Hình chiếu của vector nối robot với tư thế đặt lên hai trục thân là e_x và e_y, góc giữa hướng đặt và hướng robot là e_psi. Bên phải: sơ đồ tích phân của mô hình tuyến tính. Lệnh dv chỉ chạm e_x qua một khâu tích phân. Lệnh dw chạm e_psi qua một khâu tích phân, rồi e_psi nhân với v_r và qua một khâu tích phân nữa mới thành e_y. Trên đường cong, omega_r nối e_x với e_y.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0f172a"/>
    </marker>
    <marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b45309"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, "Segoe UI", Arial, sans-serif; }
      .h1 { font-size: 24px; font-weight: 800; fill: #0f172a; }
      .h2 { font-size: 16px; font-weight: 500; fill: #64748b; }
      .pl { font-size: 14px; font-weight: 800; fill: #64748b; letter-spacing: .05em; }
      .lab { font-size: 15px; font-weight: 500; fill: #475569; }
      .m { font-family: "Times New Roman", "STIX Two Text", Times, serif; font-style: italic; font-size: 21px; fill: #1e293b; }
      .mA { font-family: "Times New Roman", "STIX Two Text", Times, serif; font-style: italic; font-size: 22px; fill: #92400e; font-weight: 700; }
      .ms { font-family: "Times New Roman", "STIX Two Text", Times, serif; font-style: italic; font-size: 15px; }
      .bt { font-size: 20px; font-weight: 700; fill: #1e293b; }
      .note { font-size: 15px; font-weight: 500; fill: #475569; }
      .noteA { font-size: 15px; font-weight: 700; fill: #92400e; }
    </style>
  </defs>

  <rect width="1000" height="540" fill="#ffffff"/>
  <text x="30" y="42" class="h1">Ba sai số trong hệ thân xe, và vì sao không lệnh nào sửa thẳng được e<tspan font-size="17" dy="5">y</tspan></text>
  <text x="30" y="70" class="h2">Trái: hình học của sai số. Phải: mô hình tuyến tính vẽ thành chuỗi tích phân, lệnh đi vào ở bên trái.</text>
  <line x1="30" y1="88" x2="970" y2="88" stroke="#e2e8f0"/>

  <!-- ================= LEFT: geometry ================= -->
  <text x="30" y="118" class="pl">HÌNH HỌC</text>
  <path d="M 40 470 C 150 457, 239.7 361.3, 301 309.9 C 362.3 258.5, 420 200, 455 150" stroke="#94a3b8" stroke-width="3" fill="none"/>
  <text x="460" y="138" class="lab" text-anchor="end">quỹ đạo đặt</text>

  <!-- body axes -->
  <path d="M 120 420 L 372 366" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arD)"/>
  <text x="382" y="372" class="m">x<tspan class="ms" dy="4">b</tspan></text>
  <path d="M 120 420 L 98 318" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arD)"/>
  <text x="80" y="310" class="m">y<tspan class="ms" dy="4">b</tspan></text>

  <!-- robot -> reference -->
  <path d="M 120 420 L 301 310" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- e_x, e_y -->
  <path d="M 120 420 L 315.6 378.4" stroke="#b45309" stroke-width="5" stroke-linecap="round"/>
  <text x="208" y="428" class="mA" transform="rotate(-12 208 428)">e<tspan font-size="16" dy="5">x</tspan></text>
  <path d="M 315.6 378.4 L 301 310" stroke="#b45309" stroke-width="5" stroke-linecap="round"/>
  <text x="321" y="346" class="mA">e<tspan font-size="16" dy="5">y</tspan></text>

  <!-- e_psi -->
  <path d="M 301 310 L 401 289" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M 369.5 295.3 A 70 70 0 0 0 354.6 264.9" stroke="#b45309" stroke-width="2.5" fill="none"/>
  <text x="380" y="276" class="mA">e<tspan font-size="16" dy="5">ψ</tspan></text>
  <path d="M 301 310 L 368 254" stroke="#0f172a" stroke-width="2.5" marker-end="url(#arD)"/>

  <!-- reference pose -->
  <circle cx="301" cy="310" r="7" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
  <text x="236" y="252" class="lab" text-anchor="end">tư thế đặt</text>
  <text x="236" y="273" class="lab" text-anchor="end">(x<tspan font-size="12" dy="3">r</tspan><tspan dy="-3">, y</tspan><tspan font-size="12" dy="3">r</tspan><tspan dy="-3">, ψ</tspan><tspan font-size="12" dy="3">r</tspan><tspan dy="-3">)</tspan></text>
  <path d="M 241 266 L 293 305" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- robot body -->
  <g transform="rotate(-12 120 420)">
    <rect x="90" y="403" width="60" height="34" rx="6" fill="#1e293b"/>
    <rect x="98" y="397" width="22" height="7" rx="2" fill="#475569"/>
    <rect x="98" y="436" width="22" height="7" rx="2" fill="#475569"/>
    <path d="M 134 412 L 146 420 L 134 428 z" fill="#ffffff"/>
  </g>
  <text x="30" y="404" class="lab">robot</text>
  <text x="30" y="424" class="lab">(x, y, ψ)</text>

  <!-- divider -->
  <line x1="500" y1="104" x2="500" y2="476" stroke="#e2e8f0"/>

  <!-- ================= RIGHT: integrator chain ================= -->
  <text x="526" y="118" class="pl">ĐƯỜNG ĐI CỦA LỆNH</text>

  <!-- row 1 -->
  <text x="530" y="187" class="mA">δv</text>
  <path d="M 566 180 H 610" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <text x="586" y="170" class="lab" text-anchor="middle">−</text>
  <rect x="614" y="156" width="56" height="48" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="642" y="188" class="bt" text-anchor="middle">∫</text>
  <path d="M 670 180 H 712" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <text x="720" y="187" class="m">e<tspan class="ms" dy="4">x</tspan></text>

  <!-- row 2 -->
  <text x="530" y="337" class="mA">δω</text>
  <path d="M 566 330 H 610" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <text x="586" y="320" class="lab" text-anchor="middle">−</text>
  <rect x="614" y="306" width="56" height="48" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="642" y="338" class="bt" text-anchor="middle">∫</text>
  <path d="M 670 330 H 704" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <text x="708" y="337" class="m">e<tspan class="ms" dy="4">ψ</tspan></text>
  <path d="M 742 330 H 770" stroke="#b45309" stroke-width="2.5" marker-end="url(#arA)"/>
  <rect x="774" y="306" width="68" height="48" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
  <text x="808" y="337" class="mA" text-anchor="middle">× v<tspan font-size="14" dy="4">r</tspan></text>
  <path d="M 842 330 H 866" stroke="#b45309" stroke-width="2.5" marker-end="url(#arA)"/>
  <rect x="870" y="306" width="56" height="48" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="898" y="338" class="bt" text-anchor="middle">∫</text>
  <path d="M 926 330 H 944" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <text x="948" y="337" class="m">e<tspan class="ms" dy="4">y</tspan></text>

  <!-- omega_r coupling -->
  <path d="M 744 194 C 820 230, 915 250, 956 310" stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="862" y="232" class="m" font-size="19">± ω<tspan class="ms" font-size="14" dy="4">r</tspan></text>

  <!-- notes right -->
  <text x="526" y="400" class="noteA">Hàng thứ hai của B toàn 0: không lệnh nào chạm thẳng e<tspan font-size="12" dy="3">y</tspan><tspan dy="-3">.</tspan></text>
  <text x="526" y="424" class="note">Muốn dạt sang trái thì phải quay đầu sang trái trước,</text>
  <text x="526" y="446" class="note">rồi chạy tới: "nghiêng để lái" của Bài 3 trên robot vi sai.</text>
  <text x="526" y="472" class="note">Trên đường cong, khung xe quay theo (nét đứt): lệch dọc</text>
  <text x="526" y="494" class="note">và lệch ngang chuyển dần sang nhau với tốc độ ω<tspan font-size="12" dy="3">r</tspan><tspan dy="-3">.</tspan></text>

  <!-- footer note across -->
  <rect x="30" y="456" width="452" height="64" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="44" y="481" class="note">e<tspan font-size="11" dy="3">x</tspan><tspan dy="-3"> &gt; 0: robot tụt lại sau điểm đặt</tspan></text>
  <text x="44" y="503" class="note">e<tspan font-size="11" dy="3">y</tspan><tspan dy="-3"> &gt; 0: điểm đặt bên trái · e</tspan><tspan font-size="11" dy="3">ψ</tspan><tspan dy="-3"> &gt; 0: hướng đặt lệch trái</tspan></text>
</svg>
