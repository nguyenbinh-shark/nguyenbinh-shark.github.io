<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="t1 d1">
  <title id="t1">Kanayama và LQR viết dưới dạng cùng một ma trận hệ số 2 x 3</title>
  <desc id="d1">Ba ma trận hệ số sửa sai ở tốc độ 0.6 m/s, hàng trên tạo lệnh sửa vận tốc dv, hàng dưới tạo lệnh sửa vận tốc góc dw, ba cột ứng với e_x, e_y, e_psi. Kanayama tuyến tính hóa có ba ô khác 0: 1.5, 3.0 và 1.2, ba ô chéo để trống. LQR khi chạy thẳng có cùng hình dạng với các số 1.5, 5.0 và 2.45. LQR khi rẽ trái 0.66 rad/s điền thêm các ô chéo: hàng dv là 1.73, âm 0.92, âm 0.41; hàng dw là âm 1.13, 4.39, 2.19.</desc>
  <defs>
    <style>
      text { font-family: Inter, -apple-system, "Segoe UI", Arial, sans-serif; }
      .h1 { font-size: 24px; font-weight: 800; fill: #0f172a; }
      .h2 { font-size: 16px; font-weight: 500; fill: #64748b; }
      .pt { font-size: 18px; font-weight: 800; fill: #0f172a; }
      .ps { font-size: 15px; font-weight: 500; fill: #64748b; }
      .m { font-family: "Times New Roman", "STIX Two Text", Times, serif; font-style: italic; font-size: 20px; fill: #334155; }
      .ms { font-size: 14px; }
      .v { font-size: 20px; font-weight: 700; fill: #1e293b; font-variant-numeric: tabular-nums; }
      .vA { font-size: 20px; font-weight: 800; fill: #92400e; font-variant-numeric: tabular-nums; }
      .vz { font-size: 18px; font-weight: 600; fill: #94a3b8; }
      .vs { font-size: 13px; font-weight: 500; fill: #64748b; }
      .e { font-size: 14px; font-weight: 600; fill: #94a3b8; }
      .note { font-size: 15px; font-weight: 500; fill: #475569; }
      .noteA { font-size: 15px; font-weight: 700; fill: #92400e; }
    </style>
  </defs>

  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="30" y="42" class="h1">Kanayama vốn đã là một ma trận K: LQR điền số khác, và điền cả ba ô trống</text>
  <text x="30" y="70" class="h2">Hệ số sửa sai ở v<tspan font-size="12" dy="3">r</tspan><tspan dy="-3"> = 0.6 m/s. Hàng trên tạo δv, hàng dưới tạo δω; ba cột là e</tspan><tspan font-size="12" dy="3">x</tspan><tspan dy="-3">, e</tspan><tspan font-size="12" dy="3">y</tspan><tspan dy="-3">, e</tspan><tspan font-size="12" dy="3">ψ</tspan><tspan dy="-3">.</tspan></text>
  <line x1="30" y1="88" x2="970" y2="88" stroke="#e2e8f0"/>

  <!-- ============ panel 1: Kanayama ============ -->
  <text x="40" y="124" class="pt">Kanayama · Bài 5</text>
  <text x="40" y="146" class="ps">tuyến tính hóa, sin e<tspan font-size="11" dy="3">ψ</tspan><tspan dy="-3"> ≈ e</tspan><tspan font-size="11" dy="3">ψ</tspan></text>
  <g transform="translate(78 168)">
    <text x="40" y="0" class="m" text-anchor="middle">e<tspan class="ms" dy="4">x</tspan></text>
    <text x="120" y="0" class="m" text-anchor="middle">e<tspan class="ms" dy="4">y</tspan></text>
    <text x="200" y="0" class="m" text-anchor="middle">e<tspan class="ms" dy="4">ψ</tspan></text>
    <text x="-14" y="52" class="m" text-anchor="end">δv</text>
    <text x="-14" y="122" class="m" text-anchor="end">δω</text>
    <rect x="2" y="16" width="76" height="62" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <text x="40" y="47" class="v" text-anchor="middle">1.5</text>
    <text x="40" y="68" class="vs" text-anchor="middle">K<tspan font-size="10" dy="2">x</tspan></text>
    <rect x="82" y="16" width="76" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="120" y="52" class="e" text-anchor="middle">trống</text>
    <rect x="162" y="16" width="76" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="200" y="52" class="e" text-anchor="middle">trống</text>
    <rect x="2" y="86" width="76" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="40" y="122" class="e" text-anchor="middle">trống</text>
    <rect x="82" y="86" width="76" height="62" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <text x="120" y="117" class="v" text-anchor="middle">3.0</text>
    <text x="120" y="138" class="vs" text-anchor="middle">v<tspan font-size="10" dy="2">r</tspan><tspan dy="-2">·K</tspan><tspan font-size="10" dy="2">y</tspan></text>
    <rect x="162" y="86" width="76" height="62" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <text x="200" y="117" class="v" text-anchor="middle">1.2</text>
    <text x="200" y="138" class="vs" text-anchor="middle">v<tspan font-size="10" dy="2">r</tspan><tspan dy="-2">·K</tspan><tspan font-size="10" dy="2">z</tspan></text>
  </g>
  <text x="40" y="350" class="note">Ba số dò tay, kênh ngang nhân sẵn v<tspan font-size="11" dy="3">r</tspan></text>
  <text x="40" y="372" class="note">ζ = 0.45 ở mọi tốc độ</text>

  <!-- ============ panel 2: LQR straight ============ -->
  <text x="360" y="124" class="pt">LQR · chạy thẳng</text>
  <text x="360" y="146" class="ps">ω<tspan font-size="11" dy="3">r</tspan><tspan dy="-3"> = 0 · trọng số Bryson ở mục 4</tspan></text>
  <g transform="translate(398 168)">
    <text x="40" y="0" class="m" text-anchor="middle">e<tspan class="ms" dy="4">x</tspan></text>
    <text x="120" y="0" class="m" text-anchor="middle">e<tspan class="ms" dy="4">y</tspan></text>
    <text x="200" y="0" class="m" text-anchor="middle">e<tspan class="ms" dy="4">ψ</tspan></text>
    <text x="-14" y="52" class="m" text-anchor="end">δv</text>
    <text x="-14" y="122" class="m" text-anchor="end">δω</text>
    <rect x="2" y="16" width="76" height="62" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <text x="40" y="47" class="v" text-anchor="middle">1.5</text>
    <text x="40" y="68" class="vs" text-anchor="middle">k<tspan font-size="10" dy="2">x</tspan></text>
    <rect x="82" y="16" width="76" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="120" y="54" class="vz" text-anchor="middle">0</text>
    <rect x="162" y="16" width="76" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="200" y="54" class="vz" text-anchor="middle">0</text>
    <rect x="2" y="86" width="76" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="40" y="124" class="vz" text-anchor="middle">0</text>
    <rect x="82" y="86" width="76" height="62" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <text x="120" y="117" class="v" text-anchor="middle">5.0</text>
    <text x="120" y="138" class="vs" text-anchor="middle">k<tspan font-size="10" dy="2">y</tspan></text>
    <rect x="162" y="86" width="76" height="62" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <text x="200" y="117" class="v" text-anchor="middle">2.45</text>
    <text x="200" y="138" class="vs" text-anchor="middle">k<tspan font-size="10" dy="2">ψ</tspan></text>
  </g>
  <text x="360" y="350" class="note">Cùng hình dạng, số do Riccati chọn,</text>
  <text x="360" y="372" class="note">không nhân v<tspan font-size="11" dy="3">r</tspan><tspan dy="-3"> · ζ = 0.71</tspan></text>

  <!-- ============ panel 3: LQR turning ============ -->
  <text x="690" y="124" class="pt">LQR · đang rẽ trái</text>
  <text x="690" y="146" class="ps">ω<tspan font-size="11" dy="3">r</tspan><tspan dy="-3"> = +0.66 rad/s, cùng Q và R</tspan></text>
  <g transform="translate(728 168)">
    <text x="40" y="0" class="m" text-anchor="middle">e<tspan class="ms" dy="4">x</tspan></text>
    <text x="120" y="0" class="m" text-anchor="middle">e<tspan class="ms" dy="4">y</tspan></text>
    <text x="200" y="0" class="m" text-anchor="middle">e<tspan class="ms" dy="4">ψ</tspan></text>
    <text x="-14" y="52" class="m" text-anchor="end">δv</text>
    <text x="-14" y="122" class="m" text-anchor="end">δω</text>
    <rect x="2" y="16" width="76" height="62" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <text x="40" y="54" class="v" text-anchor="middle">1.73</text>
    <rect x="82" y="16" width="76" height="62" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
    <text x="120" y="54" class="vA" text-anchor="middle">−0.92</text>
    <rect x="162" y="16" width="76" height="62" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
    <text x="200" y="54" class="vA" text-anchor="middle">−0.41</text>
    <rect x="2" y="86" width="76" height="62" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
    <text x="40" y="124" class="vA" text-anchor="middle">−1.13</text>
    <rect x="82" y="86" width="76" height="62" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <text x="120" y="124" class="v" text-anchor="middle">4.39</text>
    <rect x="162" y="86" width="76" height="62" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <text x="200" y="124" class="v" text-anchor="middle">2.19</text>
  </g>
  <text x="690" y="350" class="noteA">Ô chéo: ra ngoài cua thì giảm tốc,</text>
  <text x="690" y="372" class="noteA">tụt lại sau thì bớt bẻ lái</text>

  <line x1="30" y1="400" x2="970" y2="400" stroke="#e2e8f0"/>
  <text x="30" y="428" class="note">Dấu các ô chéo đổi theo chiều rẽ (rẽ phải thì dương) và về 0 trên đường thẳng. Mọi số trong hình là −K, tức hệ số của</text>
  <text x="30" y="450" class="note">luật sửa sai δv = (hàng trên)·e, δω = (hàng dưới)·e; lệnh lqr của MATLAB trả về K mang dấu ngược lại.</text>
</svg>
