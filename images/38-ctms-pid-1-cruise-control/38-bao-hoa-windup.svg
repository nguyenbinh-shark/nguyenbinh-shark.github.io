<svg xmlns="http://www.w3.org/2000/svg" width="960" height="820" viewBox="0 0 960 820" role="img" aria-labelledby="t1 d1">
  <title id="t1">Ảnh hưởng của bão hòa lực và chống windup</title>
  <desc id="d1">Dữ liệu MATLAB với PI800,40 và lực thực giới hạn từ -1500 đến 1500 N. Không chống windup: vận tốc vọt lố 10.52 phần trăm và lắng sau 46.30 s. Tích phân có điều kiện: không vọt lố và lắng sau 26.24 s. Lực yêu cầu vẫn khởi đầu ở 8000 N.</desc>
