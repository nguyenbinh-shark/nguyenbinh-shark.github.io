<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1270" viewBox="0 0 960 1270" role="img" aria-labelledby="t1 d1">
  <title id="t1">PI800,40 khi thêm tải và thay đổi tham số mô hình</title>
  <desc id="d1">Dữ liệu MATLAB. Tải chống chuyển động 200 N xuất hiện ở giây 20 làm vận tốc giảm rồi phục hồi, trong khi lực tăng từ 500 lên 700 N. Khối lượng tăng 20 phần trăm hoặc lực cản tăng 20 phần trăm vẫn hội tụ về 10 m/s nhưng có quá độ và đuôi đáp ứng khác mô hình danh định.</desc>
