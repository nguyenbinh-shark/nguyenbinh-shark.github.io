<svg xmlns="http://www.w3.org/2000/svg" width="960" height="800" viewBox="0 0 960 800" role="img" aria-labelledby="t1 d1">
  <title id="t1">Bốn bước P và PI của CTMS: vận tốc và lực yêu cầu</title>
  <desc id="d1">Dữ liệu MATLAB cho lệnh 10 m/s. P100 còn sai số; P5000 gần đạt đích nhưng yêu cầu 50000 N ban đầu. PI600,1 có đuôi đáp ứng dài. PI800,40 đạt đích nhanh và yêu cầu 8000 N ban đầu. Các đường chưa giới hạn lực.</desc>
