  <title id="t1">Vận tốc vòng hở với lực kéo 500 N</title>
  <desc id="d1">Dữ liệu MATLAB. Lực kéo bậc 500 N làm vận tốc tiến dần đến 10 m/s. Hằng số thời gian 20 s; thời gian lên 10 đến 90 phần trăm khoảng 43.94 s.</desc>
