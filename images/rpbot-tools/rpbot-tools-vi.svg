<line x1="298" y1="186" x2="462" y2="186" stroke="#475569" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="380" y="177" font-size="14" fill="#0f172a" text-anchor="middle">DDS · dữ liệu, RViz</text>
<path d="M296 330H404V214H462" fill="none" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow-amber)"/>
<text x="350" y="352" font-size="14" fill="#b45309" text-anchor="middle">SSH đọc</text>
<text x="350" y="371" font-size="14" fill="#b45309" text-anchor="middle" class="mono">/motor_status</text>
<line x1="296" y1="485" x2="462" y2="485" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 5" marker-end="url(#arrow)"/>
<text x="380" y="476" font-size="14" fill="#0f172a" text-anchor="middle">không dây</text>
