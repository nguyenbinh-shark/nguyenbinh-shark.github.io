<text x="36" y="68" font-size="14" fill="#64748b">Windows 10/11 or Ubuntu 24.04</text>
<rect x="444" y="16" width="420" height="508" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="464" y="46" font-size="17" fill="#0f172a" font-weight="700">RPBot robot</text>
<text x="464" y="68" font-size="14" fill="#64748b">Same LAN as the PC</text>
<rect x="36" y="84" width="260" height="150" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
