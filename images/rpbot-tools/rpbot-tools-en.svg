<text x="52" y="142" font-size="14" fill="#334155">Mapping · Navigation · maps</text>
<text x="52" y="164" font-size="14" fill="#334155">Sensor, Nav2 and motor status</text>
<text x="52" y="186" font-size="14" fill="#334155">Opens RViz on the PC</text>
<text x="52" y="220" font-size="14" fill="#64748b">Windows: ROS 2 runs in WSL 2</text>
<rect x="36" y="290" width="260" height="150" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="52" y="320" font-size="17" fill="#1d4ed8" font-weight="700">DAPLink Flasher</text>
<text x="52" y="348" font-size="14" fill="#334155">Flashes .elf / .hex / .bin</text>
<text x="52" y="370" font-size="14" fill="#334155">OpenOCD · CRC per sector</text>
<text x="52" y="392" font-size="14" fill="#334155">Link lost: resumes mid-image</text>
<text x="52" y="426" font-size="14" fill="#64748b">No ROS needed on the PC</text>
