<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Two PC apps in the RPBot robot system</title>
<desc id="desc">The PC runs RPBot Studio and DAPLink Flasher. Studio reaches the robot's Raspberry Pi 5 over SSH and ROS 2 DDS. Flasher programs the STM32H723 through a CMSIS-DAP dongle, a wireless link to the DAPLink module and SWD; it can read /motor_status over SSH before halting the chip. The Pi talks to the STM32 over USB CDC micro-ROS.</desc>
<style>text{font-family:Inter,-apple-system,"Segoe UI",Arial,sans-serif}.mono{font-family:Consolas,"SFMono-Regular",Menlo,monospace}</style>
