<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img">
  <title>Biểu đồ dòng thời gian 5 Task FreeRTOS và cơ chế ngắt chiếm quyền (Preemption)</title>
  <desc>Sơ đồ phân bổ thời gian thực thi trong 1 chu kỳ 10 ms của 5 task FreeRTOS: INS_Task 1 kHz ngắt định kỳ 1 ms, motorTask 100 Hz, observeTask 100 Hz, urosTask 50 Hz, và lcdTask 20 Hz.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #24292f; font-size: 13px; paint-order: stroke; stroke: #ffffff; stroke-width: 3.5px; stroke-linejoin: round; }
    .hdr-title { font-size: 18px; font-weight: bold; fill: #24292f; }
    .task-title { font-size: 14px; font-weight: bold; }
    .task-meta { font-size: 11px; fill: #57606a; font-family: "SFMono-Regular", Consolas, monospace; }
    .time-grid { stroke: #e1e4e8; stroke-width: 1; stroke-dasharray: 2 2; }
    .time-tick { stroke: #57606a; stroke-width: 1.5; }
    .bar-ins { fill: #cf222e; stroke: #a40e26; stroke-width: 1; }
    .bar-motor { fill: #0969da; stroke: #0550ae; stroke-width: 1; }
    .bar-obs { fill: #1a7f37; stroke: #116329; stroke-width: 1; }
    .bar-uros { fill: #8250df; stroke: #6639ba; stroke-width: 1; }
    .bar-lcd { fill: #bf8700; stroke: #9a6700; stroke-width: 1; }
    .bar-idle { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>

  <rect width="960" height="620" fill="#ffffff"/>

  <!-- Tiêu đề -->
  <text x="480" y="30" text-anchor="middle" class="hdr-title">Lược Đồ Định Thời 5 Task FreeRTOS Trong Chu Kỳ 10 ms (Deadline &amp; Preemption)</text>
  <text x="480" y="52" text-anchor="middle" font-size="12" fill="#57606a">Cơ chế ưu tiên cứng: Task tần số cao (INS 1 kHz) chiếm quyền định kỳ mỗi 1 ms mà không làm vỡ deadline 10 ms của Motor</text>

  <!-- Trục thời gian 0ms -> 10ms (Scale: 1ms = 65px; Vùng vẽ x: 260 -> 910) -->
  <g transform="translate(0, 75)">
    <!-- Vạch lưới dọc 1ms một lần -->
    <line x1="260" y1="0" x2="260" y2="440" stroke="#24292f" stroke-width="2"/>
    <line x1="325" y1="0" x2="325" y2="440" class="time-grid"/>
    <line x1="390" y1="0" x2="390" y2="440" class="time-grid"/>
    <line x1="455" y1="0" x2="455" y2="440" class="time-grid"/>
    <line x1="520" y1="0" x2="520" y2="440" class="time-grid"/>
    <line x1="585" y1="0" x2="585" y2="440" class="time-grid"/>
    <line x1="650" y1="0" x2="650" y2="440" class="time-grid"/>
    <line x1="715" y1="0" x2="715" y2="440" class="time-grid"/>
    <line x1="780" y1="0" x2="780" y2="440" class="time-grid"/>
    <line x1="845" y1="0" x2="845" y2="440" class="time-grid"/>
    <line x1="910" y1="0" x2="910" y2="440" stroke="#cf222e" stroke-width="2" stroke-dasharray="4 2"/>

    <!-- Nhãn thời gian trên cùng -->
    <text x="260" y="-10" text-anchor="middle" font-weight="bold">0 ms</text>
    <text x="325" y="-10" text-anchor="middle">1 ms</text>
    <text x="390" y="-10" text-anchor="middle">2 ms</text>
    <text x="455" y="-10" text-anchor="middle">3 ms</text>
    <text x="520" y="-10" text-anchor="middle">4 ms</text>
    <text x="585" y="-10" text-anchor="middle">5 ms</text>
    <text x="650" y="-10" text-anchor="middle">6 ms</text>
    <text x="715" y="-10" text-anchor="middle">7 ms</text>
    <text x="780" y="-10" text-anchor="middle">8 ms</text>
    <text x="845" y="-10" text-anchor="middle">9 ms</text>
    <text x="910" y="-10" text-anchor="middle" font-weight="bold" fill="#cf222e">10 ms (Deadline)</text>

    <!-- TASK 1: INS_Task -->
    <g transform="translate(0, 10)">
      <rect x="25" y="0" width="220" height="60" rx="4" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
      <text x="35" y="24" class="task-title" fill="#cf222e">1. INS_Task (1000 Hz)</text>
      <text x="35" y="42" class="task-meta">Prio: High (48) · Stack: 4KB</text>
      <text x="35" y="55" font-size="10" fill="#57606a">BMI088 SPI + Mahony AHRS (~80µs)</text>

      <!-- Các xung 1kHz ngắt mỗi 1ms -->
      <rect x="260" y="15" width="8" height="30" rx="2" class="bar-ins"/>
      <rect x="325" y="15" width="8" height="30" rx="2" class="bar-ins"/>
      <rect x="390" y="15" width="8" height="30" rx="2" class="bar-ins"/>
      <rect x="455" y="15" width="8" height="30" rx="2" class="bar-ins"/>
      <rect x="520" y="15" width="8" height="30" rx="2" class="bar-ins"/>
      <rect x="585" y="15" width="8" height="30" rx="2" class="bar-ins"/>
      <rect x="650" y="15" width="8" height="30" rx="2" class="bar-ins"/>
      <rect x="715" y="15" width="8" height="30" rx="2" class="bar-ins"/>
      <rect x="780" y="15" width="8" height="30" rx="2" class="bar-ins"/>
      <rect x="845" y="15" width="8" height="30" rx="2" class="bar-ins"/>
    </g>

    <!-- TASK 2: motorTask -->
    <g transform="translate(0, 85)">
      <rect x="25" y="0" width="220" height="60" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
      <text x="35" y="24" class="task-title" fill="#0969da">2. motorTask (100 Hz)</text>
      <text x="35" y="42" class="task-meta">Prio: AboveNorm (40) · 4KB</text>
      <text x="35" y="55" font-size="10" fill="#57606a">Odom + FDCAN RobStride (~0.4ms)</text>

      <!-- Thực thi đầu chu kỳ -->
      <rect x="268" y="15" width="26" height="30" rx="2" class="bar-motor"/>
      <text x="300" y="34" font-size="11" fill="#0969da" font-weight="bold">0.4ms</text>
    </g>

    <!-- TASK 3: observeTask -->
    <g transform="translate(0, 160)">
      <rect x="25" y="0" width="220" height="60" rx="4" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
      <text x="35" y="24" class="task-title" fill="#1a7f37">3. observeTask (100 Hz)</text>
      <text x="35" y="42" class="task-meta">Prio: Normal+1 (25) · 4KB</text>
      <text x="35" y="55" font-size="10" fill="#57606a">Kalman thích nghi trượt (~0.25ms)</text>

      <!-- Thực thi ngay sau motorTask -->
      <rect x="294" y="15" width="16" height="30" rx="2" class="bar-obs"/>
      <text x="315" y="34" font-size="11" fill="#1a7f37" font-weight="bold">0.25ms</text>
    </g>

    <!-- TASK 4: urosTask -->
    <g transform="translate(0, 235)">
      <rect x="25" y="0" width="220" height="60" rx="4" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
      <text x="35" y="24" class="task-title" fill="#8250df">4. urosTask (50 Hz)</text>
      <text x="35" y="42" class="task-meta">Prio: Normal (24) · 12KB</text>
      <text x="35" y="55" font-size="10" fill="#57606a">micro-ROS Executor spin (~1.2ms)</text>

      <!-- Thực thi bị ngắt bởi INS_Task lúc 1ms -->
      <rect x="310" y="15" width="15" height="30" class="bar-uros"/>
      <!-- Bị gián đoạn 8µs bởi INS ở 325px -->
      <rect x="333" y="15" width="60" height="30" class="bar-uros"/>
      <text x="400" y="34" font-size="11" fill="#8250df" font-weight="bold">~1.2ms (Bị ngắt bởi INS @ 1ms)</text>
    </g>

    <!-- TASK 5: lcdTask -->
    <g transform="translate(0, 310)">
      <rect x="25" y="0" width="220" height="60" rx="4" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/>
      <text x="35" y="24" class="task-title" fill="#9a6700">5. lcdTask (20 Hz)</text>
      <text x="35" y="42" class="task-meta">Prio: Low (8) · 4KB</text>
      <text x="35" y="55" font-size="10" fill="#57606a">ST7789 GUI render (~2.5ms)</text>

      <!-- Thực thi khi các task trên xong -->
      <rect x="400" y="15" width="55" height="30" class="bar-lcd"/>
      <rect x="463" y="15" width="57" height="30" class="bar-lcd"/>
      <rect x="528" y="15" width="50" height="30" class="bar-lcd"/>
      <text x="585" y="34" font-size="11" fill="#9a6700" font-weight="bold">~2.5ms (Chạy nền khi rảnh)</text>
    </g>

    <!-- CPU IDLE -->
    <g transform="translate(0, 385)">
      <rect x="25" y="0" width="220" height="45" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
      <text x="35" y="22" font-weight="bold" fill="#57606a">CPU IDLE / Sleep</text>
      <text x="35" y="37" font-size="10" fill="#57606a">Dư tải ~55% năng lực xử lý</text>

      <rect x="580" y="10" width="330" height="25" rx="2" class="bar-idle"/>
      <text x="745" y="27" text-anchor="middle" font-size="11" fill="#57606a">CPU Rảnh Chờ Chu Kỳ Mới (Margin ~5.5 ms)</text>
    </g>
  </g>

  <!-- Chân trang giải thích re-anchor -->
  <g transform="translate(40, 550)">
    <rect x="0" y="0" width="880" height="55" rx="4" fill="#f6f8fa" stroke="#0969da" stroke-width="1"/>
    <text x="15" y="20" font-weight="bold" fill="#0969da">Chiến lược chống tích lũy trôi pha (Overrun Recovery):</text>
    <text x="15" y="40" font-size="12" fill="#24292f">Sử dụng <tspan font-family="monospace" fill="#cf222e">osDelayUntil(&amp;last_wake, PERIOD)</tspan>. Nếu chu kỳ bị kéo dài do nghẽn bus, firmware tự động <tspan font-family="monospace" fill="#0969da">last_wake = osKernelGetTickCount()</tspan> để re-anchor, triệt tiêu bão sự kiện (burst storm).</text>
  </g>
</svg>

