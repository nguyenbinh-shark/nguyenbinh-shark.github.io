<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img">
  <title>Bản đồ bộ nhớ STM32H723 và phân bổ hai Heap riêng biệt</title>
  <desc>Sơ đồ kiến trúc bộ nhớ STM32H723: Flash 1MB, DTCM 128KB (.data 0 wait-state), AXI SRAM 320KB (.bss, FreeRTOS heap 96KB, micro-ROS heap 96KB, DMA UART và USB CDC), và đường kết nối DMA.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #24292f; font-size: 14px; paint-order: stroke; stroke: #ffffff; stroke-width: 3.5px; stroke-linejoin: round; }
    .title-txt { font-size: 16px; font-weight: bold; fill: #0969da; }
    .sub-txt { font-size: 12px; fill: #57606a; }
    .addr-txt { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 12px; fill: #57606a; font-weight: 600; }
    .box-flash { fill: #ddf4ff; stroke: #0969da; stroke-width: 2; }
    .box-dtcm { fill: #ffebe9; stroke: #cf222e; stroke-width: 2; }
    .box-axisram { fill: #dafbe1; stroke: #1a7f37; stroke-width: 2; }
    .box-heap1 { fill: #bf8700; fill-opacity: 0.2; stroke: #9a6700; stroke-width: 1.5; stroke-dasharray: 4 2; }
    .box-heap2 { fill: #8250df; fill-opacity: 0.2; stroke: #8250df; stroke-width: 1.5; stroke-dasharray: 4 2; }
    .box-dma { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .warn-box { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.5; stroke-dasharray: 4 4; }
  </style>

  <rect width="960" height="620" fill="#ffffff"/>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0969da"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
    </marker>
  </defs>

  <!-- Tiêu đề sơ đồ -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#24292f">Bản Đồ Phân Bổ Bộ Nhớ STM32H723VGT6 &amp; Kiến Trúc Hai Heap Riêng Biệt</text>
  <text x="480" y="54" text-anchor="middle" class="sub-txt">Flash: 1024 KB (18.7% dùng) | RAM D1: 320 KB AXI-SRAM (82.6% dùng) + 128 KB DTCM (Data TCM)</text>

  <!-- Cột bên trái: Flash Memory (1024 KB) -->
  <g transform="translate(40, 80)">
    <rect x="0" y="0" width="220" height="480" rx="6" class="box-flash"/>
    <text x="110" y="28" text-anchor="middle" class="title-txt">Flash Memory (1 MB)</text>
    <text x="110" y="48" text-anchor="middle" class="addr-txt">0x0800_0000 - 0x080F_FFFF</text>

    <!-- Phân vùng đã dùng trong Flash -->
    <rect x="15" y="65" width="190" height="150" rx="4" fill="#0969da" fill-opacity="0.15" stroke="#0969da" stroke-width="1.5"/>
    <text x="110" y="90" text-anchor="middle" font-weight="bold" fill="#0969da">Mã Thực Thi (.text)</text>
    <text x="110" y="110" text-anchor="middle" class="sub-txt">FreeRTOS Kernel, HAL Drivers</text>
    <text x="110" y="128" text-anchor="middle" class="sub-txt">libmicroros.a (eProsima RMW)</text>
    <text x="110" y="146" text-anchor="middle" class="sub-txt">AHRS Mahony, Adaptive Kalman</text>
    <text x="110" y="170" text-anchor="middle" font-weight="bold" fill="#24292f">Hằng số (.rodata)</text>
    <text x="110" y="195" text-anchor="middle" font-weight="bold" fill="#0969da">Tổng: 195,640 B (18.7%)</text>

    <!-- Flash trống -->
    <rect x="15" y="225" width="190" height="240" rx="4" fill="#ffffff" fill-opacity="0.7" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="110" y="340" text-anchor="middle" fill="#57606a" font-weight="bold">Flash Trống (81.3%)</text>
    <text x="110" y="362" text-anchor="middle" class="sub-txt">~828 KB khả dụng cho</text>
    <text x="110" y="380" text-anchor="middle" class="sub-txt">TF2, Navigation sau này</text>
  </g>

  <!-- Cột giữa: DTCM 128KB (Data Tightly-Coupled Memory) -->
  <g transform="translate(290, 80)">
    <rect x="0" y="0" width="280" height="220" rx="6" class="box-dtcm"/>
    <text x="140" y="28" text-anchor="middle" font-weight="bold" fill="#cf222e" font-size="15">DTCM RAM (128 KB)</text>
    <text x="140" y="48" text-anchor="middle" class="addr-txt">0x2000_0000 - 0x2001_FFFF</text>

    <rect x="15" y="65" width="250" height="70" rx="4" fill="#cf222e" fill-opacity="0.15" stroke="#cf222e" stroke-width="1"/>
    <text x="140" y="88" text-anchor="middle" font-weight="bold" fill="#cf222e">Biến khởi tạo sẵn (.data)</text>
    <text x="140" y="106" text-anchor="middle" class="sub-txt">0 Wait-State CPU (192 MHz/64-bit)</text>
    <text x="140" y="122" text-anchor="middle" class="sub-txt">Fast Stack &amp; Local Fast Variables</text>

    <!-- Cảnh báo DMA không tới được DTCM -->
    <rect x="15" y="145" width="250" height="62" rx="4" class="warn-box"/>
    <text x="140" y="168" text-anchor="middle" font-weight="bold" fill="#cf222e" font-size="12">⚠️ DMA KHÔNG THỂ TRUY CẬP!</text>
    <text x="140" y="186" text-anchor="middle" font-size="11" fill="#57606a">DMA1/DMA2/BDMA bị chặn phần cứng</text>
    <text x="140" y="200" text-anchor="middle" font-size="11" fill="#57606a">Tuyệt đối không đặt DMA Buffer tại DTCM</text>
  </g>

  <!-- Khối CPU Cortex-M7 Core ở giữa -->
  <g transform="translate(290, 325)">
    <rect x="0" y="0" width="280" height="105" rx="6" fill="#24292f" stroke="#0969da" stroke-width="2"/>
    <text x="140" y="28" text-anchor="middle" font-weight="bold" fill="#ffffff" font-size="15">ARM Cortex-M7 @ 192 MHz</text>
    <text x="140" y="48" text-anchor="middle" font-size="12" fill="#54aeff">D-Cache TẮT có chủ đích (Né coherency DMA)</text>
    <text x="140" y="68" text-anchor="middle" font-size="12" fill="#d0d7de">FPU Double Precision (FPv5-D16)</text>
    <text x="140" y="88" text-anchor="middle" font-size="12" fill="#2da44e" font-weight="bold">Zero-Wait State sang Flash (I-Cache ON)</text>
  </g>

  <!-- Khối Bus Matrix & Peripherals -->
  <g transform="translate(290, 450)">
    <rect x="0" y="0" width="280" height="110" rx="6" class="box-dma"/>
    <text x="140" y="24" text-anchor="middle" font-weight="bold" fill="#24292f">Bus Matrix &amp; Ngoại vi DMA</text>
    <text x="140" y="44" text-anchor="middle" class="sub-txt">• DMA1: USART1 Debug (TX Ring 4KB)</text>
    <text x="140" y="62" text-anchor="middle" class="sub-txt">• USB OTG HS: micro-ROS Agent (12 Mbps)</text>
    <text x="140" y="80" text-anchor="middle" class="sub-txt">• FDCAN1 &amp; FDCAN2: Dual RobStride Bus</text>
    <text x="140" y="98" text-anchor="middle" class="sub-txt">• SPI1 / SPI2: Màn LCD ST7789 &amp; IMU BMI088</text>
  </g>

  <!-- Cột bên phải: AXI SRAM 320 KB (RAM_D1) -->
  <g transform="translate(600, 80)">
    <rect x="0" y="0" width="320" height="480" rx="6" class="box-axisram"/>
    <text x="160" y="28" text-anchor="middle" font-weight="bold" fill="#1a7f37" font-size="15">AXI-SRAM RAM_D1 (320 KB)</text>
    <text x="160" y="48" text-anchor="middle" class="addr-txt">0x2400_0000 - 0x2404_FFFF</text>

    <!-- FreeRTOS Heap 96KB -->
    <rect x="15" y="65" width="290" height="80" rx="4" class="box-heap1"/>
    <text x="160" y="90" text-anchor="middle" font-weight="bold" fill="#9a6700">FreeRTOS Heap (heap_4: 96 KB)</text>
    <text x="160" y="110" text-anchor="middle" class="sub-txt">5 Task Stacks: INS, Motor, Observe, uROS, LCD</text>
    <text x="160" y="128" text-anchor="middle" class="sub-txt">Queue, Mutexes, Timers, Semaphores</text>

    <!-- micro-ROS Heap 96KB -->
    <rect x="15" y="155" width="290" height="80" rx="4" class="box-heap2"/>
    <text x="160" y="180" text-anchor="middle" font-weight="bold" fill="#8250df">micro-ROS Heap (Fork heap_4: 96 KB)</text>
    <text x="160" y="200" text-anchor="middle" class="sub-txt">RMW XRCE-DDS Session Buffers, Entities</text>
    <text x="160" y="218" text-anchor="middle" class="sub-txt">Độc lập hoàn toàn chống nghẽn FreeRTOS</text>

    <!-- Biến toàn cục & Ring buffers (.bss) -->
    <rect x="15" y="245" width="290" height="110" rx="4" fill="#1a7f37" fill-opacity="0.12" stroke="#1a7f37" stroke-width="1"/>
    <text x="160" y="268" text-anchor="middle" font-weight="bold" fill="#1a7f37">Biến Chưa Khởi Tạo &amp; Buffer (.bss: 78.5 KB)</text>
    <text x="160" y="288" text-anchor="middle" class="sub-txt">• UART1 TX DMA Ring Buffer: 4,096 B</text>
    <text x="160" y="306" text-anchor="middle" class="sub-txt">• USB CDC RX Ring Buffer: 2,048 B</text>
    <text x="160" y="324" text-anchor="middle" class="sub-txt">• Bộ nhớ đệm tĩnh Message ROS 2 (Zero-alloc)</text>
    <text x="160" y="344" text-anchor="middle" font-weight="bold" fill="#1a7f37">Tổng RAM D1 Dùng: 270,576 B (82.6%)</text>

    <!-- RAM D1 Trống -->
    <rect x="15" y="365" width="290" height="100" rx="4" fill="#ffffff" fill-opacity="0.7" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="160" y="410" text-anchor="middle" fill="#57606a" font-weight="bold">RAM D1 Trống (17.4%)</text>
    <text x="160" y="430" text-anchor="middle" class="sub-txt">57,104 B khả dụng</text>
  </g>

  <!-- Mũi tên kết nối -->
  <!-- Flash -> CPU -->
  <line x1="260" y1="365" x2="290" y2="365" stroke="#0969da" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  
  <!-- CPU -> DTCM -->
  <line x1="430" y1="325" x2="430" y2="300" stroke="#cf222e" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  
  <!-- CPU -> AXI SRAM -->
  <line x1="570" y1="365" x2="600" y2="365" stroke="#1a7f37" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  
  <!-- DMA -> AXI SRAM (Hợp lệ) -->
  <path d="M 570 505 Q 585 505 600 300" fill="none" stroke="#1a7f37" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-green)"/>
  <text x="592" y="525" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a7f37">DMA Truy Cập AXI-SRAM OK</text>

  <!-- Chú thích chân trang -->
  <text x="480" y="600" text-anchor="middle" font-size="12" fill="#57606a">Kiến trúc tách 2 heap cô lập 100% rủi ro OOM giữa micro-ROS dynamic serialization và chu trình realtime FreeRTOS</text>
</svg>

