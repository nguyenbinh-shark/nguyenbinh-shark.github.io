<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-labelledby="title desc"><title id="title">Hệ treo hai khối lượng CTMS</title><desc id="desc">Khối lượng thân m1 nối khối lượng bánh m2 qua lò xo k1, giảm chấn b1 và lực actuator u. Bánh nối mặt đường w qua lò xo k2 và giảm chấn b2. Đầu ra q là x1 trừ x2.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#334155"/></marker></defs><rect width="1080" height="600" rx="20" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#0f172a"><text x="40" y="50" font-size="28" font-weight="bold">Một góc xe: hai khối lượng, hai chuyển động</text><rect x="260" y="95" width="450" height="85" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="485" y="132" text-anchor="middle" font-size="24">Thân xe: m₁ = 2500 kg</text><text x="485" y="163" text-anchor="middle" font-size="20">x₁: độ lệch quanh cân bằng</text><rect x="300" y="330" width="370" height="70" rx="14" fill="#e2e8f0" stroke="#475569" stroke-width="3"/><text x="485" y="371" text-anchor="middle" font-size="24">Bánh/cầu: m₂ = 320 kg</text><path d="M335 180v20l-20 15 40 20-40 20 40 20-40 20 20 15v20 M335 400v15l-20 12 40 16-40 16 40 16-20 12v28" fill="none" stroke="#2563eb" stroke-width="4"/><text x="225" y="260" font-size="23">k₁</text><text x="225" y="465" font-size="23">k₂</text><g stroke="#475569" stroke-width="4" fill="none"><path d="M490 180v40m-28 0v70h56v-70m-28 30v80M490 400v25m-28 0v45h56v-45m-28 25v65"/></g><text x="530" y="265" font-size="23">b₁</text><text x="530" y="465" font-size="23">b₂</text><path d="M625 205v105" stroke="#334155" stroke-width="4" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="660" y="260" font-size="22">+u lên thân</text><text x="660" y="290" font-size="22">−u lên bánh</text><path d="M200 515h570" stroke="#16a34a" stroke-width="7"/><text x="280" y="565" font-size="24">Mặt đường: w(t), là nhiễu</text><path d="M820 180v-70 M820 395v-65" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><text x="850" y="140" font-size="23">x₁</text><text x="850" y="365" font-size="23">x₂</text><text x="790" y="225" font-size="23" font-weight="bold">q = x₁ − x₂</text><text x="790" y="255" font-size="18">đo biến dạng hệ treo</text><text x="40" y="575" font-size="15" fill="#64748b">Phương trình và thông số: CTMS Suspension; hình chuyển thể CC BY-SA 4.0. Chiều lên là dương.</text></g></svg>
