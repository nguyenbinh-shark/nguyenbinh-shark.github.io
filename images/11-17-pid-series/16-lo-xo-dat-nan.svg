<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Lò xo và đất nặn: hai cách trở lại sau cùng một cú ấn</title>
  <desc id="desc">Hai bảng so sánh một bàn tay ấn lò xo và đất nặn. Lò xo bật về chiều cao cũ khi buông tay, còn đất nặn giữ lại dấu tay và không tự kéo về.</desc>
  <defs>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .ink { fill: #0f172a; }
      .muted { fill: #475569; }
      .green { fill: #047857; }
      .rose { fill: #be123c; }
      .small-cap { font-size: 14px; font-weight: 800; letter-spacing: 1px; }
    </style>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#e11d48"/>
    </marker>
  </defs>

  <rect width="1200" height="680" fill="#f8fafc"/>
  <text x="60" y="55" class="ink" font-size="32" font-weight="800">Một cú ấn, hai tính khí</text>
  <text x="60" y="87" class="muted" font-size="19">Thôi tác động rồi, đối tượng có tự tìm đường về hay không?</text>

  <!-- Spring card -->
  <rect x="55" y="122" width="530" height="472" rx="9" fill="#ffffff" stroke="#a7f3d0" stroke-width="2"/>
  <rect x="55" y="122" width="10" height="472" rx="5" fill="#10b981"/>
  <circle cx="108" cy="170" r="25" fill="#dcfce7"/>
  <path d="M 96 170 l9 9 17-21" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="148" y="164" fill="#047857" font-size="15" font-weight="800" letter-spacing="1.1">LÒ XO</text>
  <text x="148" y="191" class="ink" font-size="23" font-weight="800">Tự ổn định</text>
  <line x1="320" y1="218" x2="320" y2="490" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 8"/>
  <text x="145" y="226" class="small-cap" fill="#64748b">ẤN XUỐNG</text>
  <text x="367" y="226" class="small-cap" fill="#64748b">BUÔNG TAY</text>

  <!-- compressed spring scene -->
  <g transform="translate(0 0)">
    <!-- simplified hand -->
    <path d="M 128 260 C 133 244 144 237 154 238 L 189 247 L 212 240 C 221 237 228 242 229 249 C 230 256 225 261 217 264 L 194 272 L 211 278 C 219 281 222 288 218 294 C 214 301 206 302 198 299 L 172 290 L 180 303 C 185 311 181 318 174 321 C 167 324 162 320 158 313 L 140 284 L 128 260 Z" fill="#f5c6ad" stroke="#9f6b54" stroke-width="2"/>
    <path d="M 145 254 L 185 263 M 152 267 L 193 278 M 160 282 L 198 291" fill="none" stroke="#c28d72" stroke-width="2.5" stroke-linecap="round"/>
    <!-- compressed coils -->
    <path d="M 161 354 C 174 342 198 342 211 354 C 224 366 224 373 211 385 C 198 397 174 397 161 385 C 148 373 148 366 161 354 Z
             M 161 382 C 174 370 198 370 211 382 C 224 394 224 401 211 413 C 198 425 174 425 161 413 C 148 401 148 394 161 382 Z
             M 161 410 C 174 398 198 398 211 410 C 224 422 224 429 211 441 C 198 453 174 453 161 441 C 148 429 148 422 161 410 Z" fill="none" stroke="#64748b" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 150 447 H 222" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <path d="M 186 329 V 314" stroke="#e11d48" stroke-width="3" marker-end="url(#arrow-rose)"/>
    <text x="186" y="474" text-anchor="middle" class="muted" font-size="15">bị nén thấp xuống</text>
  </g>

  <!-- spring release scene -->
  <g>
    <path d="M 376 446 H 516" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <path d="M 387 438 C 400 422 425 422 438 438 C 451 454 451 461 438 477 C 425 493 400 493 387 477 C 374 461 374 454 387 438 Z
             M 387 404 C 400 388 425 388 438 404 C 451 420 451 427 438 443 C 425 459 400 459 387 443 C 374 427 374 420 387 404 Z
             M 387 370 C 400 354 425 354 438 370 C 451 386 451 393 438 409 C 425 425 400 425 387 409 C 374 393 374 386 387 370 Z
             M 387 336 C 400 320 425 320 438 336 C 451 352 451 359 438 375 C 425 391 400 391 387 375 C 374 359 374 352 387 336 Z" fill="none" stroke="#64748b" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 364 337 H 461" stroke="#86efac" stroke-width="3" stroke-dasharray="6 6"/>
    <text x="466" y="342" fill="#047857" font-size="14" font-weight="700">vị trí cũ</text>
    <path d="M 337 416 C 356 405 358 376 369 359" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrow-green)"/>
    <circle cx="485" cy="370" r="16" fill="#dcfce7"/>
    <path d="M 477 370 l6 6 11-14" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="444" y="474" text-anchor="middle" class="muted" font-size="15">tự bật về cân bằng</text>
  </g>

  <rect x="86" y="520" width="468" height="51" rx="7" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="320" y="543" text-anchor="middle" fill="#047857" font-size="16" font-weight="800">Có lực tự kéo về sau khi buông tay</text>
  <text x="320" y="562" text-anchor="middle" class="muted" font-size="14">Tự ổn định không đồng nghĩa phản ứng nhanh.</text>

  <!-- Clay card -->
  <rect x="615" y="122" width="530" height="472" rx="9" fill="#ffffff" stroke="#fecdd3" stroke-width="2"/>
  <rect x="615" y="122" width="10" height="472" rx="5" fill="#e11d48"/>
  <circle cx="668" cy="170" r="25" fill="#ffe4e6"/>
  <path d="M 656 158 L 680 182 M 680 158 L 656 182" stroke="#e11d48" stroke-width="5" stroke-linecap="round"/>
  <text x="708" y="164" fill="#be123c" font-size="15" font-weight="800" letter-spacing="1.1">ĐẤT NẶN</text>
  <text x="708" y="191" class="ink" font-size="23" font-weight="800">Không tự ổn định</text>
  <line x1="880" y1="218" x2="880" y2="490" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 8"/>
  <text x="705" y="226" class="small-cap" fill="#64748b">ẤN XUỐNG</text>
  <text x="927" y="226" class="small-cap" fill="#64748b">BUÔNG TAY</text>

  <!-- clay press scene -->
  <path d="M 696 260 C 701 244 713 238 725 240 L 759 249 L 781 241 C 790 238 797 243 798 250 C 799 257 794 262 786 265 L 762 273 L 782 280 C 790 283 793 290 789 296 C 785 303 777 304 769 301 L 744 292 L 751 305 C 756 313 752 320 745 323 C 738 326 732 322 728 315 L 710 285 L 696 260 Z" fill="#f5c6ad" stroke="#9f6b54" stroke-width="2"/>
  <path d="M 714 254 L 754 264 M 721 268 L 761 278 M 730 283 L 768 293" fill="none" stroke="#c28d72" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 682 410 C 686 381 707 368 735 369 C 763 370 784 384 788 410 C 789 422 779 433 764 438 H 705 C 690 433 680 422 682 410 Z" fill="#60a5fa" stroke="#2563eb" stroke-width="3"/>
  <path d="M 697 407 C 712 400 727 402 739 407 M 711 419 C 725 413 742 415 754 419" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 743 335 V 354" stroke="#e11d48" stroke-width="3" marker-end="url(#arrow-rose)"/>
  <text x="735" y="474" text-anchor="middle" class="muted" font-size="15">mềm ra dưới lực ấn</text>

  <!-- clay release scene -->
  <path d="M 920 412 C 920 400 934 392 952 392 H 1022 C 1040 392 1054 400 1054 412 C 1054 425 1040 434 1022 436 H 952 C 934 434 920 425 920 412 Z" fill="#60a5fa" stroke="#2563eb" stroke-width="3"/>
  <path d="M 944 405 C 956 400 968 400 979 406 C 990 400 1004 400 1015 406 C 1026 401 1038 403 1045 409" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 947 391 C 950 378 963 375 974 383 C 983 369 1000 369 1008 383 C 1020 375 1034 379 1038 392" fill="none" stroke="#93c5fd" stroke-width="7" stroke-linecap="round"/>
  <path d="M 890 415 C 906 403 908 388 915 377" fill="none" stroke="#e11d48" stroke-width="4" marker-end="url(#arrow-rose)"/>
  <circle cx="1049" cy="368" r="16" fill="#ffe4e6"/>
  <path d="M 1041 360 L 1057 376 M 1057 360 L 1041 376" stroke="#e11d48" stroke-width="3" stroke-linecap="round"/>
  <text x="985" y="474" text-anchor="middle" class="muted" font-size="15">giữ nguyên dấu tay</text>

  <rect x="646" y="520" width="468" height="51" rx="7" fill="#fff1f2" stroke="#fecdd3"/>
  <text x="880" y="543" text-anchor="middle" fill="#be123c" font-size="16" font-weight="800">Không có lực tự kéo về</text>
  <text x="880" y="562" text-anchor="middle" class="muted" font-size="14">Muốn đổi vị trí, phải có tác động điều khiển tiếp.</text>

  <!-- footer -->
  <rect x="55" y="620" width="1090" height="38" rx="7" fill="#0f172a"/>
  <text x="600" y="645" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">Trước khi chỉnh PID: hãy hỏi đối tượng là lò xo hay đất nặn.</text>
</svg>
