<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Hai loại rung trong vòng điều khiển PID</title>
  <desc id="desc">So sánh rung do độ trễ của đối tượng và rung do khâu tích phân tích lũy quá nhiều. Mỗi loại có nguyên nhân và hướng xử lý khác nhau.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#d97706"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .ink { fill: #0f172a; }
      .muted { fill: #475569; }
      .cap { font-size: 15px; font-weight: 800; letter-spacing: 1.2px; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="60" y="58" class="ink" font-size="32" font-weight="800">Hai thứ rung nhìn giống nhau, nhưng khác bệnh</text>
  <text x="60" y="91" class="muted" font-size="19">Chẩn đoán nguyên nhân trước khi vặn thêm bất kỳ hệ số nào.</text>

  <!-- Delay panel -->
  <rect x="55" y="125" width="530" height="500" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <rect x="55" y="125" width="10" height="500" rx="5" fill="#3b82f6"/>
  <circle cx="111" cy="176" r="26" fill="#dbeafe"/>
  <circle cx="111" cy="176" r="15" fill="none" stroke="#2563eb" stroke-width="4"/>
  <path d="M 111 176 V 164 M 111 176 L 121 183" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <text x="151" y="168" fill="#1d4ed8" font-size="16" font-weight="800" letter-spacing="1.2">RUN VÌ TRỄ</text>
  <text x="151" y="195" class="ink" font-size="22" font-weight="800">Lệnh đến trước, phản hồi đến sau</text>

  <!-- Delay chart -->
  <g transform="translate(95 226)">
    <path d="M 0 0 V 175 H 445" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 0 132 H 445 M 0 75 H 445" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="5 7"/>
    <path d="M 0 135 H 68 V 44 H 445" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="9 6"/>
    <text x="420" y="34" text-anchor="end" class="muted" font-size="15" font-weight="700">đích mới</text>
    <path d="M 0 135 H 151 C 174 135, 177 43, 222 43 C 265 43, 268 130, 309 130 C 352 130, 352 60, 390 60 C 417 60, 427 78, 445 82" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
    <path d="M 70 151 V 164 M 151 151 V 164 M 70 159 H 151" stroke="#e11d48" stroke-width="3"/>
    <text x="111" y="190" text-anchor="middle" fill="#be123c" font-size="16" font-weight="800">Tu: chưa thấy gì</text>
    <circle cx="151" cy="135" r="7" fill="#ffffff" stroke="#e11d48" stroke-width="4"/>
    <path d="M 272 16 C 245 3, 213 5, 188 24" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <text x="284" y="14" fill="#1d4ed8" font-size="15" font-weight="700">đang sửa chuyện đã qua</text>
  </g>

  <rect x="88" y="443" width="464" height="69" rx="7" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="109" y="466" fill="#1d4ed8" class="cap">NGUYÊN NHÂN</text>
  <text x="109" y="491" class="ink" font-size="17">Đối tượng chỉ trả lời sau Tu; lệnh mới chồng lên lệnh cũ.</text>

  <rect x="88" y="526" width="464" height="72" rx="7" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="109" y="550" fill="#047857" class="cap">HƯỚNG XỬ LÝ</text>
  <text x="109" y="575" class="ink" font-size="17">Lấy mẫu đủ dày trong mỗi Tu; giảm Kp nếu còn lắc.</text>

  <!-- Integral debt panel -->
  <rect x="615" y="125" width="530" height="500" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
  <rect x="615" y="125" width="10" height="500" rx="5" fill="#d97706"/>
  <circle cx="671" cy="176" r="26" fill="#ffedd5"/>
  <rect x="659" y="161" width="24" height="30" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
  <path d="M 665 169 H 677 M 665 176 H 677 M 665 183 H 674" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  <text x="711" y="168" fill="#b45309" font-size="16" font-weight="800" letter-spacing="1.2">RUN VÌ SỔ NỢ DÀY</text>
  <text x="711" y="195" class="ink" font-size="22" font-weight="800">Qua đích rồi vẫn còn bị đẩy</text>

  <!-- Integral chart and debt blocks -->
  <g transform="translate(655 226)">
    <path d="M 0 0 V 175 H 445" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 0 132 H 445 M 0 75 H 445" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="5 7"/>
    <path d="M 0 84 H 445" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="9 6"/>
    <text x="420" y="72" text-anchor="end" class="muted" font-size="15" font-weight="700">đích</text>
    <path d="M 0 145 C 70 145, 88 123, 132 93 C 171 66, 193 29, 233 34 C 279 40, 283 125, 329 130 C 368 135, 382 69, 417 70 C 430 70, 439 76, 445 80" fill="none" stroke="#d97706" stroke-width="6" stroke-linecap="round"/>
    <circle cx="190" cy="50" r="7" fill="#ffffff" stroke="#e11d48" stroke-width="4"/>
    <path d="M 188 45 C 148 20, 123 18, 91 32" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#arrow-amber)"/>
    <text x="206" y="18" fill="#b45309" font-size="15" font-weight="700">nợ cũ vẫn đẩy</text>

    <g transform="translate(27 112)">
      <rect x="0" y="30" width="48" height="20" rx="3" fill="#fde68a" stroke="#d97706"/>
      <rect x="5" y="8" width="48" height="20" rx="3" fill="#fcd34d" stroke="#d97706"/>
      <rect x="10" y="-14" width="48" height="20" rx="3" fill="#f59e0b" stroke="#b45309"/>
      <path d="M 21 -4 H 48 M 16 18 H 43 M 11 40 H 38" stroke="#92400e" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <rect x="648" y="443" width="464" height="69" rx="7" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="669" y="466" fill="#b45309" class="cap">NGUYÊN NHÂN</text>
  <text x="669" y="491" class="ink" font-size="17">Khâu I tích lũy quá lâu, nhất là khi cơ cấu đã bão hòa.</text>

  <rect x="648" y="526" width="464" height="72" rx="7" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="669" y="550" fill="#047857" class="cap">HƯỚNG XỬ LÝ</text>
  <text x="669" y="575" class="ink" font-size="17">Kéo dài Ti / giảm Ki; chặn tích phân khi bão hòa.</text>

  <!-- Shared takeaway -->
  <rect x="55" y="652" width="1090" height="72" rx="8" fill="#0f172a"/>
  <path d="M 93 675 L 116 698 M 116 675 L 93 698" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <text x="145" y="683" fill="#ffffff" font-size="18" font-weight="800" letter-spacing="1">ĐỪNG CHỮA THEO TRIỆU CHỨNG</text>
  <text x="145" y="708" fill="#e2e8f0" font-size="19">Cùng là “rung”, nhưng một bên thiếu thông tin kịp thời, một bên thừa lệnh tích lũy.</text>
</svg>
